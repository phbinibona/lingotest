/* Separate Home shortcut: keep the existing Activities / change languages control,
   with a compact home icon at the far right. */
.home-icon{
  width:42px;
  height:42px;
  flex:0 0 42px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  background:#fff;
  color:#084ca8;
  text-decoration:none;
  border:1px solid rgba(255,255,255,.45);
  box-sizing:border-box;
  transition:transform .15s ease, background .15s ease;
}
.home-icon svg{
  width:24px;
  height:24px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.home-icon:hover{transform:translateY(-1px);background:#f5f9ff}
.home-icon:focus-visible{outline:3px solid rgba(255,255,255,.7);outline-offset:2px}

/* ===== LINGOGO / RETAIL — job-ready treatment ===== */
:root{
  --design-black:#101010;
  --design-paper:#f4f0e8;
  --design-white:#fffdf8;
  --design-red:#e24b35;
  --design-line:#bdb8ae;
  --design-grey:#6f6c66;
}

body{
  background:
    linear-gradient(rgba(16,16,16,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(16,16,16,.035) 1px, transparent 1px),
    var(--design-paper);
  background-size:28px 28px;
  color:var(--design-black);
}

.banner{
  background:var(--design-black);
  box-shadow:none;
  border-bottom:5px solid var(--design-red);
}

.brand-mark{
  border-radius:0;
  background:var(--design-red);
  color:#fff;
  box-shadow:none;
  font-weight:900;
}

.brand{letter-spacing:.12em;font-weight:900}
.tagline{font-family:inherit;letter-spacing:.05em;text-transform:uppercase;opacity:.72}
.language-pair{border-radius:0;border-color:#6c6c6c;background:transparent}
.home-link,.home-icon{
  border-radius:0 !important;
  background:#fff !important;
  color:#111 !important;
  border:0 !important;
  box-shadow:none !important;
}

.page{width:min(980px,calc(100% - 24px))}
.panel{
  border-radius:0;
  box-shadow:none;
  border:1.5px solid var(--design-black);
  background:var(--design-white);
}
.hero{
  position:relative;
  overflow:hidden;
  min-height:230px;
  display:grid;
  grid-template-columns:minmax(0,1.5fr) minmax(180px,.7fr);
  align-items:end;
  gap:28px;
  background:var(--design-white);
}
.hero:after{
  content:"LINGOGO";
  align-self:stretch;
  display:flex;
  align-items:flex-end;
  justify-content:flex-end;
  padding:0 0 4px;
  color:var(--design-red);
  font-size:clamp(2.2rem,6vw,5.8rem);
  font-weight:900;
  line-height:.84;
  letter-spacing:-.06em;
  text-align:right;
  max-width:7ch;
  word-break:break-word;
}
h1{
  font-size:clamp(2.4rem,7vw,5.7rem);
  line-height:.88;
  letter-spacing:-.055em;
  text-transform:uppercase;
  max-width:8ch;
  margin-bottom:18px;
}
.hero p{
  max-width:60ch;
  color:#45423d;
  font-size:1rem;
}
.design-kicker{
  margin:0 0 12px;
  color:var(--design-red);
  font-size:.78rem;
  font-weight:900;
  letter-spacing:.16em;
  text-transform:uppercase;
}
.design-disclaimer{
  margin-top:14px;
  font-size:.72rem;
  color:var(--design-grey);
}

.section-head{align-items:flex-start}
.number{
  border-radius:0;
  background:var(--design-black);
  color:#fff;
  font-weight:900;
}
.section-title{
  font-size:1.28rem;
  text-transform:uppercase;
  letter-spacing:.02em;
  font-weight:900;
}
.setup-lead{color:#55514b}
.level-grid{gap:0;border:1.5px solid var(--design-black)}
.level-card{
  border:0;
  border-right:1.5px solid var(--design-black);
  border-radius:0;
  background:#fff;
  min-height:132px;
}
.level-card:last-child{border-right:0}
.level-card:hover,.level-card.selected{
  background:var(--design-black);
  color:#fff;
  border-color:var(--design-black);
}
.level-card.selected .level-note,.level-card:hover .level-note{color:#d8d8d8}
.level-name{text-transform:uppercase;letter-spacing:.02em}
.topic-step{border-top:1.5px solid var(--design-black)}
.substep-badge{border-radius:0;background:var(--design-red);color:#fff}
.topic-label{text-transform:uppercase;letter-spacing:.02em}
input[type=text]{
  border-radius:0;
  border:1.5px solid var(--design-black);
  min-height:58px;
  background:#fff;
  font-size:1.02rem;
}
input[type=text]:focus{
  border-color:var(--design-red);
  box-shadow:0 0 0 3px rgba(226,75,53,.15);
}
.examples-wrap{border-top:1px solid var(--design-line)}
.quiet-examples .choice{
  border-radius:0;
  border:1px solid var(--design-line);
  background:#f7f4ed;
}
.choice:hover,.choice.selected,
.quiet-examples .choice:hover,.quiet-examples .choice.selected{
  background:var(--design-red);
  border-color:var(--design-red);
  color:#fff;
}
.primary-btn{
  border-radius:0;
  background:var(--design-red);
  text-transform:uppercase;
  letter-spacing:.06em;
}
.secondary-btn,.response-actions button,.collection-btn{
  border-radius:0;
  box-shadow:none;
}
.collection-btn{
  background:var(--design-black);
  color:#fff;
}
.activity{border-top:6px solid var(--design-red)}
.situation{
  font-size:clamp(1.45rem,4vw,2.3rem);
  line-height:1.05;
  letter-spacing:-.025em;
  max-width:28ch;
}
.intentions{
  grid-template-columns:repeat(2,1fr);
  gap:0;
  border:1.5px solid var(--design-black);
}
.intent{
  min-height:92px;
  border:0;
  border-right:1.5px solid var(--design-black);
  border-radius:0;
  background:#fff;
  text-transform:uppercase;
  letter-spacing:.025em;
  font-weight:900;
}
.intent:last-child{border-right:0}
.intent:hover,.intent.selected{
  background:var(--design-black);
  color:#fff;
}
.response-card{
  border-radius:0;
  border:1.5px solid var(--design-black);
  background:#fff;
  padding:18px;
}
.response-card:nth-child(odd){margin-left:0;margin-right:8%}
.response-card:nth-child(even){margin-left:8%;margin-right:0}
.response-text{
  font-size:clamp(1.18rem,3vw,1.7rem);
  line-height:1.18;
  letter-spacing:-.02em;
}
.response-note{
  border-top:1px solid var(--design-line);
  padding-top:9px;
}
.design-context-wrap{
  margin:22px 0 8px;
  padding-top:20px;
  border-top:1.5px solid var(--design-black);
}
.design-context-label{
  margin-bottom:9px;
  font-size:.78rem;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.12em;
}
.design-context-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:0;
  border:1.5px solid var(--design-black);
}
.design-context{
  min-height:92px;
  border:0;
  border-right:1.5px solid var(--design-black);
  border-bottom:1.5px solid var(--design-black);
  background:#fff;
  padding:12px;
  text-align:left;
  cursor:pointer;
}
.design-context:nth-child(3n){border-right:0}
.design-context:nth-last-child(-n+3){border-bottom:0}
.design-context:hover,.design-context.selected{
  background:var(--design-red);
  color:#fff;
}
.design-context strong{
  display:block;
  font-size:1rem;
  text-transform:uppercase;
  letter-spacing:.025em;
}
.design-context span{
  display:block;
  margin-top:5px;
  font-size:.76rem;
  line-height:1.28;
  opacity:.78;
}
.design-fields{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:14px;
}
.design-chip{
  padding:5px 8px;
  border:1px solid var(--design-black);
  font-size:.68rem;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.05em;
  background:#fff;
}
.footer{
  color:#4f4b46;
  text-transform:uppercase;
  letter-spacing:.08em;
}

@media(max-width:700px){
  .hero{grid-template-columns:1fr;min-height:0}
  .hero:after{display:none}
  .level-grid{grid-template-columns:1fr}
  .level-card{border-right:0;border-bottom:1.5px solid var(--design-black)}
  .level-card:last-child{border-bottom:0}
  .design-context-grid{grid-template-columns:1fr}
  .design-context{border-right:0 !important;border-bottom:1.5px solid var(--design-black) !important}
  .design-context:last-child{border-bottom:0 !important}
  .intentions{grid-template-columns:1fr}
  .intent{border-right:0;border-bottom:1.5px solid var(--design-black)}
  .intent:last-child{border-bottom:0}
  .response-card:nth-child(n){margin-left:0;margin-right:0}
}


/* LingoGo standard compact navigation */
.home-icon{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;border-radius:9px;background:#fff;color:var(--primary-dark);text-decoration:none}

  .brand-mark{display:none!important}

async function callGeminiAPI(prompt){const r=await fetch('/.netlify/functions/gemini',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,model:'gemini-2.5-flash',temperature:.7})});let d;try{d=await r.json()}catch{throw new Error('Invalid server response')}if(!r.ok)throw new Error(d?.error||'Server error');const result=d?.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('')||'';if(!result)throw new Error('Empty AI response');return result}
function parseJSON(text){const clean=String(text||'').replace(/```json/gi,'').replace(/```/g,'').trim();const start=clean.indexOf('{'),end=clean.lastIndexOf('}');if(start<0||end<0)throw new Error('AI format error');let d;try{d=JSON.parse(clean.slice(start,end+1))}catch{throw new Error('AI format error')}const raw=Array.isArray(d?.situations)?d.situations:[];const usable=raw.slice(0,3).map(s=>{const situation=String(s?.situation||'').trim();const intentions=(Array.isArray(s?.intentions)?s.intentions:[]).slice(0,3).map(i=>{const label=String(i?.label||'').trim();const responses=(Array.isArray(i?.responses)?i.responses:[]).slice(0,2).map(r=>({text:String(r?.text||'').trim(),note:String(r?.note||'').trim()})).filter(r=>r.text);return {label,responses}}).filter(i=>i.label&&i.responses.length);return {situation,intentions}}).filter(s=>s.situation&&s.intentions.length);if(!usable.length)throw new Error('AI format error');return usable}
function renderSituation(){const s=situations[current];$('activity').style.display='block';$('waiting').style.display='none';$('progress').textContent=(current+1)+' / '+situations.length;$('situation').textContent=s.situation;$('intentions').innerHTML='';$('responses').style.display='none';$('responses').innerHTML='';$('nextWrap').style.display='none';s.intentions.forEach(intent=>{const b=document.createElement('button');b.className='intent';b.textContent=intent.label;b.onclick=()=>showResponses(intent,b);$('intentions').appendChild(b)})}
function showResponses(intent,b){document.querySelectorAll('.intent').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');const box=$('responses');box.innerHTML='';box.style.display='block';intent.responses.forEach(r=>{const card=document.createElement('div');card.className='response-card';card.innerHTML='<div class="response-text">'+r.text+'</div><div class="response-note">'+r.note+'</div>';const actions=document.createElement('div');actions.className='response-actions';const listen=document.createElement('button');listen.textContent=tr('listen');listen.onclick=()=>speak(r.text);const save=document.createElement('button');save.textContent=tr('save');save.onclick=()=>saveSentence(r.text);const translate=document.createElement('button');translate.textContent=tr('translate');translate.onclick=async()=>{translate.disabled=true;try{const prompt='Translate this '+targetLanguage+' sentence into '+uiNames[uiLanguage]+'. Return only the translation, no explanation: '+JSON.stringify(r.text);const txt=(await callGeminiAPI(prompt)).trim();let out=card.querySelector('.response-translation');if(!out){out=document.createElement('div');out.className='response-note response-translation';card.insertBefore(out,actions)}out.textContent=tr('translation')+': '+txt}catch(e){notice(tr('serverError'),'error')}finally{translate.disabled=false}};actions.append(listen,translate,save);card.append(actions);box.append(card)});$('nextWrap').style.display='block'}
$('nextBtn').onclick=()=>{current=(current+1)%situations.length;renderSituation()};
const COLLECTION_KEY='lingototal_saved_sentences_v2';
function getCollection(){try{return JSON.parse(localStorage.getItem(COLLECTION_KEY)||'[]')}catch{return []}}
function setCollection(d){localStorage.setItem(COLLECTION_KEY,JSON.stringify(d));$('collectionCount').textContent=d.length}
function saveSentence(sentence){const d=getCollection();if(d.some(x=>x.sentence===sentence&&x.targetLanguage===targetLanguage))return notice(tr('alreadySaved'),'info');d.unshift({sentence,targetLanguage,targetName:targetNames[targetLanguage],theme:$('themeInput').value.trim()});setCollection(d);notice(tr('savedMessage'),'success')}
function renderCollection(){const list=$('collectionList'),d=getCollection();list.innerHTML='';if(!d.length){list.textContent=tr('emptyCollection');return}d.forEach((x,i)=>{const row=document.createElement('div');row.className='collection-item';row.innerHTML='<div class="collection-sentence">'+x.sentence+'</div><div class="collection-meta">'+(x.targetName||'')+(x.theme?' · '+tr('themeLabel')+': '+x.theme:'')+'</div>';const a=document.createElement('div');a.className='response-actions';const l=document.createElement('button');l.textContent=tr('listen');l.onclick=()=>speak(x.sentence);const r=document.createElement('button');r.textContent=tr('remove');r.onclick=()=>{d.splice(i,1);setCollection(d);renderCollection()};a.append(l,r);row.append(a);list.append(row)})}
$('openCollectionBtn').onclick=()=>{renderCollection();$('collectionPanel').style.display='block'};$('closeCollectionBtn').onclick=()=>{$('collectionPanel').style.display='none'};
$('downloadCollectionBtn').onclick=()=>{const d=getCollection();if(!d.length)return notice(tr('noSaved'),'info');const blob=new Blob(['\uFEFF'+d.map((x,i)=>(i+1)+'. '+x.sentence).join('\n')],{type:'text/plain;charset=utf-8'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='My-LingoTotal-Collection.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),500)};
$('generateBtn').onclick=async()=>{const theme=$('themeInput').value.trim();if(!selectedLevel)return notice(tr('selectLevel'),'error');if(!theme)return notice(tr('enterTopic'),'error');const level={beginner:'A1-A2 simple high-frequency spoken language',intermediate:'B1-B2 natural everyday and workplace language with flexibility and common conversational chunks'}[selectedLevel];const prompt=`Create a LingoGo Home Services & Repairs language-learning activity for a learner of ${targetLanguage}.

LEARNER'S EXACT REQUEST — THIS HAS ABSOLUTE PRIORITY:
"${theme}"

Level: ${level}.

The learner may have written the request in ANY language. Understand the request as written, but produce the activity according to the language rules below.

CRITICAL RELEVANCE RULES:
- Create exactly THREE closely related real-life situations.
- All three situations must explore different useful aspects of the learner's exact job, repair or home-service need.
- Do not drift into generic DIY vocabulary, unrelated trades, or a fixed home-maintenance syllabus.
- The learner's submission remains authoritative at situation, intention and response level.
- Use realistic contexts where relevant: making first contact, explaining the problem or job, arranging a visit, asking about availability, describing access, discussing materials or options, clarifying what is included, asking for an estimate or price, agreeing dates, dealing with delays, checking progress, raising a problem politely, asking for changes, discussing payment, guarantees or follow-up.
- Suitable professionals can include plumbers, electricians, painters, decorators, builders, carpenters, gardeners, appliance repairers, handymen, installers, technicians and similar services, but ONLY introduce a trade if it fits the learner's exact request.
- Do not invent defects, prices, legal obligations, guarantees, safety certifications or technical facts that the learner has not supplied.
- If the learner describes a potentially dangerous electrical, gas, structural or other hazard, focus on language for explaining the issue and seeking an appropriately qualified professional; do not give technical repair instructions.

For EACH of the 3 situations:
- Write the situation in the interface language ${uiNames[uiLanguage]}.
- Give exactly 3 clearly different communicative intentions in ${uiNames[uiLanguage]}.
- For EACH intention give exactly 2 short, natural ${targetLanguage} responses.
- For each response give one brief note in ${uiNames[uiLanguage]} explaining tone, usefulness or nuance.
- Keep the target-language responses concise, natural and genuinely useful for speaking.
- Prefer normal spoken language over textbook language or overly technical terminology.
- Include polite but confident language for clarifying costs, timing, responsibilities or problems when relevant.
- Do not translate the target-language response in the note.

Return ONLY valid JSON, with no markdown or commentary, in exactly this structure:
{"situations":[{"situation":"...","intentions":[{"label":"...","responses":[{"text":"...","note":"..."},{"text":"...","note":"..."}]}]}]}`;try{$('loading').classList.add('loading-active');$('waiting').style.display='none';$('generateBtn').disabled=true;situations=parseJSON(await callGeminiAPI(prompt));current=0;renderSituation()}catch(e){$('waiting').style.display='block';notice(tr('serverError')+' '+e.message,'error')}finally{$('loading').classList.remove('loading-active');$('generateBtn').disabled=false}};
applyLanguage();$('collectionCount').textContent=getCollection().length;
});
</script>
<script>
(function(){const cache=new Map();let audio=null;async function speak(text,language='en-GB',speakingRate=.95){if(audio){try{audio.pause()}catch{}}const key=language+'|'+speakingRate+'|'+text;let src=cache.get(key);if(!src){const r=await fetch('/.netlify/functions/google-tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,language,speakingRate})});if(!r.ok)throw new Error('Audio error');const b=await r.blob();src=URL.createObjectURL(b);cache.set(key,src)}audio=new Audio(src);await audio.play()}window.LingoTTS={speak}})();
</script>

<script id="lingototal-generator-bar-init">
(function(){function init(){var b=document.getElementById('generateBtn');if(!b)return;var p=b.closest('.panel');if(p)p.classList.add('generator-panel')}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init()})();
</script>
<script id="lingototal-homeservices-chip-links">(function(){function init(){document.querySelectorAll('[data-homeservices-chip]').forEach(function(link){link.addEventListener('click',function(){var input=document.getElementById('themeInput');if(!input)return;input.value=link.textContent.trim();setTimeout(function(){input.focus()},350)})})}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init()})();</script><script id="lingototal-correct-topic-labels">(function(){const L={"en":["Plumbing","Electrical work","Building work","Painting & decorating","Gardening","Repairs"],"ca":["Lampisteria","Electricitat","Obres","Pintura i decoració","Jardineria","Reparacions"],"es":["Fontanería","Electricidad","Obras","Pintura y decoración","Jardinería","Reparaciones"],"fr":["Plomberie","Électricité","Travaux","Peinture et décoration","Jardinage","Réparations"],"de":["Sanitärarbeiten","Elektroarbeiten","Bauarbeiten","Malerarbeiten","Gartenarbeit","Reparaturen"],"it":["Idraulica","Lavori elettrici","Lavori edili","Pittura e decorazione","Giardinaggio","Riparazioni"],"pt":["Canalização","Eletricidade","Obras","Pintura e decoração","Jardinagem","Reparações"],"eu":["Iturgintza","Elektrizitatea","Eraikuntza-lanak","Margotzea eta dekorazioa","Lorezaintza","Konponketak"],"ja":["配管","電気工事","建築工事","塗装と内装","庭仕事","修理"],"ar":["السباكة","أعمال الكهرباء","أعمال البناء","الدهان والديكور","البستنة","الإصلاحات"]};function init(){const q=new URLSearchParams(location.search),ui=q.get('ui')||localStorage.getItem('lingototal_ui_language')||'en',labels=L[ui]||L.en;document.querySelectorAll('[data-homeservices-chip]').forEach(function(link,i){link.textContent=labels[i]||L.en[i]})}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init()})();</script>
<script id="lingototal-standard-header-links">
document.addEventListener('DOMContentLoaded',()=>{
  const params=new URLSearchParams(location.search);
  const ui=params.get('ui')||localStorage.getItem('lingototal_ui_language')||'en';
  const target=params.get('target')||localStorage.getItem('lingototal_target_language')||'English';
  const codes={English:'EN',en:'EN',Catalan:'CA','Català':'CA',ca:'CA',Spanish:'ES','Español':'ES',es:'ES',French:'FR','Français':'FR',fr:'FR',German:'DE',Deutsch:'DE',de:'DE',Italian:'IT',it:'IT',Portuguese:'PT',pt:'PT',Basque:'EU',eu:'EU',Welsh:'CY',cy:'CY',Gaelic:'GD','Scottish Gaelic':'GD',gd:'GD',Japanese:'JA',ja:'JA',Arabic:'AR',ar:'AR'};
  const pair=document.getElementById('languagePair');
  if(pair)pair.dataset.short=(codes[ui]||String(ui).slice(0,2).toUpperCase())+' → '+(codes[target]||String(target).slice(0,2).toUpperCase());
  const indexURL=`index.html?ui=${encodeURIComponent(ui)}&target=${encodeURIComponent(target)}`;
  document.querySelectorAll('.index-link').forEach(link=>link.href=indexURL);
});
</script>
