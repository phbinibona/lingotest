<script>
(function(){
const KEY='lingototal_saved_sentences_v2';
const LEGACY_KEYS=['lingototal_saved_sentences_v1'];

function migrateLegacyCollections(){
  let current=[];
  try{
    const raw=JSON.parse(localStorage.getItem(KEY)||'[]');
    current=Array.isArray(raw)?raw:[];
  }catch{current=[]}

  const combined=[...current];

  LEGACY_KEYS.forEach(oldKey=>{
    try{
      const oldRaw=JSON.parse(localStorage.getItem(oldKey)||'[]');
      if(Array.isArray(oldRaw)) combined.push(...oldRaw);
    }catch{}
  });

  const seen=new Set();
  const merged=combined
    .map(x=>{
      if(typeof x==='string') return {sentence:x.trim()};
      return x&&typeof x==='object'?x:null;
    })
    .filter(Boolean)
    .filter(x=>String(x.sentence||x.text||'').trim())
    .filter(x=>{
      const sentence=String(x.sentence||x.text||'').trim();
      const lang=String(x.targetLanguage||x.language||'');
      const k=(lang+'|'+sentence).toLowerCase();
      if(seen.has(k)) return false;
      seen.add(k);
      return true;
    });

  localStorage.setItem(KEY,JSON.stringify(merged));
}
migrateLegacyCollections();

const params=new URLSearchParams(location.search);let ui=params.get('ui')||localStorage.getItem('lingototal_ui_language')||'en';if(!T[ui])ui='en';let target=params.get('target')||localStorage.getItem('lingototal_target_language')||'English';const tr=k=>(T[ui]||T.en)[k]||T.en[k]||k;document.documentElement.lang=ui;document.documentElement.dir=ui==='ar'?'rtl':'ltr';document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=tr(e.dataset.i18n));document.getElementById('pair').textContent=(uiNames[ui]||ui)+' → '+target;document.getElementById('homeLink').href=`index.html?ui=${encodeURIComponent(ui)}&target=${encodeURIComponent(target)}`;
let importMode=false,importItems=[],selected=new Set();
function norm(x){if(typeof x==='string')return{sentence:x.trim(),targetLanguage:target,targetName:target,theme:'',source:'Import'};return{sentence:String(x.sentence||x.text||'').trim(),targetLanguage:x.targetLanguage||x.language||target,targetName:x.targetName||x.targetLanguage||x.language||target,theme:x.theme||x.category||'',source:x.source||'LingoTotal',savedDate:x.savedDate||x.dateSaved||'',review:x.review||{times:0,correct:0,wrong:0,lastPractised:null}}}

function filters(){const items=current(),langs=[...new Set(items.map(x=>x.targetLanguage).filter(Boolean))].sort(),themes=[...new Set(items.map(x=>x.theme).filter(Boolean))].sort();const lf=document.getElementById('languageFilter'),tf=document.getElementById('themeFilter'),lv=lf.value,tv=tf.value;lf.innerHTML=`<option value="">${tr('all')}</option>`+langs.map(x=>`<option>${esc(x)}</option>`).join('');tf.innerHTML=`<option value="">${tr('all')}</option>`+themes.map(x=>`<option>${esc(x)}</option>`).join('');if(langs.includes(lv))lf.value=lv;if(themes.includes(tv))tf.value=tv}

document.getElementById('uploadInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const text=await f.text();let arr;if(f.name.toLowerCase().endsWith('.json')){const d=JSON.parse(text);arr=Array.isArray(d)?d:(d.phrases||d.sentences||[])}else{arr=text.split(/\r?\n/).map(s=>s.replace(/^\s*\d+[.)]\s*/,'').replace(/^\[[^\]]+\]\s*/,'').trim()).filter(Boolean)};arr=unique(arr.map(norm).filter(x=>x.sentence));if(!arr.length)throw 0;importItems=arr;importMode=true;selected=new Set(arr.map((_,i)=>i));document.getElementById('importBar').classList.remove('hidden');render()}catch{alert(tr('invalidFile'))}e.target.value=''};

function renderExercise(){if(!session.length){document.getElementById('exercise').classList.remove('hidden');document.getElementById('exercise').innerHTML=`<p>${tr('noPhrases')}</p>`;return}const item=session[pos%session.length],box=document.getElementById('exercise');box.classList.remove('hidden');let html='';if(type==='gap'){const w=words(item.sentence),eligible=w.map((x,i)=>({x,i})).filter(o=>/[\p{L}\p{N}]/u.test(o.x)&&o.x.length>3),hide=eligible.slice().sort(()=>Math.random()-.5).slice(0,Math.min(2,eligible.length)).map(o=>o.i);const prompt=w.map((x,i)=>hide.includes(i)?'______':x).join(' ').replace(/\s+([,.!?;:])/g,'$1');html=`<div class="prompt">${esc(prompt)}</div><input id="textAnswer" type="text" style="width:100%;padding:11px;border:1px solid var(--border);border-radius:9px" placeholder="${tr('yourAnswer')}">${nav()}`;box.innerHTML=html;const expected=hide.map(i=>w[i]).join(' ');document.getElementById('showBtn').onclick=()=>document.getElementById('feedback').textContent=item.sentence;document.getElementById('textAnswer').dataset.expected=expected;}

function drawJumble(){const answer=document.getElementById('answerLine'),wordBank=document.getElementById('jumbleBank');answer.innerHTML='';wordBank.innerHTML='';const used=new Set(chosen.map(x=>x.originalIndex));bank.forEach(tok=>{if(used.has(tok.originalIndex))return;const b=document.createElement('button');b.type='button';b.className='word';b.textContent=tok.word;b.onclick=()=>{chosen.push(tok);drawJumble()};wordBank.appendChild(b)});if(!chosen.length){const ph=document.createElement('span');ph.className='answer-placeholder';ph.textContent=tr('answerEmpty');answer.appendChild(ph)}else chosen.forEach((tok,i)=>{const b=document.createElement('button');b.type='button';b.className='word';b.textContent=tok.word;b.onclick=()=>{chosen.splice(i,1);drawJumble()};answer.appendChild(b)})}

})();

<script id="lingototal-language-state-v2">
(function(){
  const VALID_UI=['en','ca','es','fr','de','it','pt','eu','ja','ar'];
  const VALID_TARGET=['English','Catalan','Spanish','French','German','Italian','Portuguese','Basque','Japanese','Arabic'];
  const q=new URLSearchParams(window.location.search);
  let ui=q.get('ui')||localStorage.getItem('lingototal_ui_language')||'en';
  let target=q.get('target')||localStorage.getItem('lingototal_target_language')||'English';
  if(!VALID_UI.includes(ui)) ui='en';
  if(!VALID_TARGET.includes(target)) target='English';
  localStorage.setItem('lingototal_ui_language',ui);
  localStorage.setItem('lingototal_target_language',target);
  const returnURL=`index.html?ui=${encodeURIComponent(ui)}&target=${encodeURIComponent(target)}`;
  document.querySelectorAll('a[href="index.html"],a[href^="index.html?"]').forEach(a=>a.href=returnURL);
})();
</script>
