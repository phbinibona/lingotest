drawJumble(); document.getElementById('clearJumbleBtn').onclick=()=>{chosen.length=0;document.getElementById('feedback').textContent='';document.getElementById('feedback').className='feedback';drawJumble()}; document.getElementById('checkJumbleBtn').onclick=()=>{const fb=document.getElementById('feedback');if(chosen.length!==bank.length){fb.textContent=tr('incomplete');fb.className='feedback bad';return}const ok=normal(built())===normal(item.sentence);fb.textContent=ok?tr('correct'):tr('tryAgain');fb.className='feedback '+(ok?'good':'bad');updateReview(item,ok);if(ok){document.getElementById('checkJumbleBtn').classList.add('hidden');document.getElementById('clearJumbleBtn').classList.add('hidden');document.getElementById('nextBtn').classList.remove('hidden')}}; box._chosen=chosen; }
else if(type==='listen'){html=`<div class="prompt">${tr('typeSentence')}</div><div class="actions"><button class="btn secondary" id="listenBtn">🔊 ${tr('listenNow')}</button></div><input id="textAnswer" type="text" style="width:100%;margin-top:10px;padding:11px;border:1px solid var(--border);border-radius:9px" placeholder="${tr('yourAnswer')}">${nav()}`;box.innerHTML=html;document.getElementById('listenBtn').onclick=()=>speak(item);document.getElementById('showBtn').onclick=()=>document.getElementById('feedback').textContent=item.sentence;}
else if(type==='speak'){html=`<div class="speaking-card"><div class="prompt">${esc(tr('speakPrompt'))}</div><div class="speaking-reference">${esc(item.sentence)}</div><div class="speaking-controls"><button class="btn secondary" id="listenBtn">🔊 ${esc(tr('listenNow'))}</button><button class="btn primary" id="recordSpeechBtn">● ${esc(tr('recordVoice'))}</button><button class="btn secondary" id="stopSpeechBtn" disabled>■ ${esc(tr('stopRecording'))}</button><button class="btn secondary" id="replaySpeechBtn" disabled>▶ ${esc(tr('replayVoice'))}</button><button class="btn primary" id="assessSpeechBtn" disabled>${esc(tr('checkSpeaking'))}</button></div><audio class="speaking-playback hidden" id="speechPlayback" controls></audio><div class="speaking-status" id="speakingStatus"></div><div class="speaking-result hidden" id="speakingResult"></div><div class="actions"><button class="btn primary" id="nextBtn">${esc(tr('next'))}</button></div></div>`;box.innerHTML=html;document.getElementById('listenBtn').onclick=()=>speak(item);document.getElementById('recordSpeechBtn').onclick=startSpeakingRecording;document.getElementById('stopSpeechBtn').onclick=stopSpeakingRecording;document.getElementById('replaySpeechBtn').onclick=()=>{if(speakingUrl)new Audio(speakingUrl).play().catch(()=>{})};document.getElementById('assessSpeechBtn').onclick=()=>assessSpeaking(item);if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){document.getElementById('recordSpeechBtn').disabled=true;speakingStatus('micUnavailable',true)}}
 else{html=`<div class="prompt">${esc(item.theme||tr('recallPrompt'))}</div><p>${tr('recallPrompt')}</p>${nav()}`;box.innerHTML=html;document.getElementById('showBtn').onclick=()=>document.getElementById('feedback').textContent=item.sentence;}
