<script id="lingototal-strict-interface-language">
(function(){
  const VALID_UI=['en','ca','es','fr','de','it','pt','eu','ja','ar'];
  const q=new URLSearchParams(location.search);
  const selected=q.get('ui')||localStorage.getItem('lingototal_ui_language')||'en';
  const ui=VALID_UI.includes(selected)?selected:'en';
  document.documentElement.lang=ui;
  document.documentElement.dir=(ui==='ar'?'rtl':'ltr');
  document.documentElement.dataset.interfaceLanguage=ui;
  window.LINGOTOTAL_STRICT_UI=true;

  // If a translation-controlled element has not been translated by the page,
  // do not leave its original English authoring text visible for a non-English UI.
  if(ui!=='en'){
    const scrub=()=>{
      document.querySelectorAll('[data-i18n]').forEach(el=>{
        if(el.dataset.ltTranslated==='1') return;
        const key=el.getAttribute('data-i18n');
        // Existing page translation code normally runs first. We only mark/scrub obvious untouched English.
        const englishLike=/\b(the|your|choose|start|next|create|learn|language|activity|activities|change|level|theme|write|listen|check|correct|challenge|practice|confidence|basics)\b/i;
        if(englishLike.test((el.textContent||'').trim()) && !el.closest('select')) el.textContent='';
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
        if(el.dataset.ltTranslated==='1') return;
        const v=el.getAttribute('placeholder')||'';
        if(/\b(try|write|enter|type|choose|your|anything)\b/i.test(v)) el.setAttribute('placeholder','');
      });
    };
    setTimeout(scrub,0);
  }
})();
