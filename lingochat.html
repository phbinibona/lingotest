<body><header class="topbar"><a class="logo" id="logo" href="index.html"><span class="logo-mark">LT</span><span class="logo-word">LingoTotal</span></a><div class="activity-name">LingoChat</div><div class="right-tools"><span class="pair" id="pair"></span><a class="home" id="home" href="index.html" aria-label="Home">⌂</a></div></header><main>
<section class="panel hero"><h1>LingoChat</h1><p id="lead"></p></section>
<section class="panel step-panel active" id="setup"><div class="section-head"><span class="step">1</span><div class="section-title" id="setupTitle"></div></div><div class="field"><label id="topicLabel" for="topic"></label><input id="topic" maxlength="180" autocomplete="off"></div><div class="field"><label id="detailLabel" for="details"></label><textarea id="details" maxlength="400"></textarea></div><button class="primary wide" id="generate" type="button"></button><div class="status" id="generateStatus" role="status" aria-live="polite"></div></section>
<section class="panel step-panel hidden" id="promptPanel"><div class="section-head"><span class="step">2</span><div class="section-title" id="promptTitle"></div></div><p class="note" id="context"></p><div class="model-box"><div class="model-label" id="speakerLabel"></div><p class="statement" id="statement" lang=""></p><button class="small-btn" id="listenStatement" type="button"></button></div><h3 id="suggestionTitle"></h3><div id="suggestions"></div><p class="note" id="choiceHint"></p><div class="action-row"><button class="primary" id="recordFirst" type="button"></button><button class="secondary" id="stopFirst" type="button" disabled></button></div><div id="firstRecordStatus" class="status" role="status" aria-live="polite"></div><div class="attempt hidden" id="firstAttempt"><label id="firstLabel" for="firstTranscript"></label><audio id="firstAudio" controls class="hidden"></audio><textarea id="firstTranscript" spellcheck="false"></textarea><p class="note" id="firstEditHint"></p><div class="action-row"><button class="small-btn" id="useSuggestion" type="button"></button><button class="primary" id="confirmFirst" type="button"></button></div></div><p class="privacy" id="privacy"></p></section>
<section class="panel step-panel hidden" id="retryPanel"><div class="section-head"><span class="step">3</span><div class="section-title" id="retryTitle"></div></div><div id="firstSummary" class="output"></div><div id="firstFeedback" class="feedback-box"></div><p id="retryLead"></p><div class="action-row"><button class="primary" id="recordSecond" type="button"></button><button class="secondary" id="stopSecond" type="button" disabled></button><button class="small-btn" id="keepFirst" type="button"></button></div><div id="secondRecordStatus" class="status" role="status" aria-live="polite"></div><div class="attempt hidden" id="secondAttempt"><label id="secondLabel" for="secondTranscript"></label><audio id="secondAudio" controls class="hidden"></audio><textarea id="secondTranscript" spellcheck="false"></textarea><p class="note" id="secondEditHint"></p><button class="primary" id="confirmSecond" type="button"></button></div></section>
<section class="panel step-panel hidden" id="responsePanel"><div class="section-head"><span class="step">4</span><div class="section-title" id="responseTitle"></div></div><div class="model-box"><div class="model-label" id="youSaidLabel"></div><p id="youSaid" lang=""></p><div class="model-label" id="otherSaysLabel"></div><p id="partnerResponse" lang=""></p><button class="small-btn" id="listenResponse" type="button"></button></div><div id="finalFeedback" class="feedback-box"></div><p id="returnLead"></p><div class="return-actions"><button class="primary" id="continue" type="button"></button><button class="secondary" id="newConversation" type="button"></button></div></section>
</main><footer id="footer"></footer><script src="lingochat.js?v=20260927b" defer></script></body></html>
