<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LingoTotal · Olivia</title>
<style>
:root{font-family:Inter,Arial,sans-serif;background:#171717;color:#f7f8fb}*{box-sizing:border-box}body{margin:0}header{background:#203c65;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px}header a{color:#fff;text-decoration:none;font-weight:800}header strong{font-size:1.05rem}main{max-width:1030px;margin:auto;padding:16px 14px 50px}.grid{display:grid;grid-template-columns:minmax(250px,340px) 1fr;gap:15px}.card{background:#242930;border:1px solid #485463;padding:18px;margin-bottom:14px}h2{margin:0 0 12px;font-size:1.2rem}p{line-height:1.5}.video{min-height:220px;background:#111c2b;display:grid;place-items:center}video{width:100%;max-height:400px;object-fit:contain}label{display:block;font-weight:750;margin:15px 0 6px}input,textarea{width:100%;padding:11px;border:1px solid #68788f;background:#111923;color:#fff;font:inherit}textarea{min-height:85px}button{border:0;background:#3277e8;color:#fff;padding:11px 15px;margin:8px 7px 0 0;cursor:pointer;font:inherit;font-weight:750}button.secondary{background:#3b4b60}button:disabled{opacity:.48;cursor:not-allowed}.text{padding:17px;border-left:4px solid #ffbd54;background:#16253a;font-size:1.13rem;line-height:1.7;white-space:pre-wrap}.status{min-height:22px;color:#ffdc91}.muted{color:#c1cbd8}.hide{display:none!important}.options{display:grid;gap:8px;margin:12px 0}.options button{margin:0;text-align:left;background:#364961}.options button:hover,.options button:focus{background:#3277e8}.options button.chosen{outline:3px solid #ffc857}.feedback{background:#193b31;border-left:4px solid #67c99b;padding:14px;white-space:pre-wrap}audio{width:100%;margin-top:10px}.recording{color:#ffc857;font-weight:800}@media(max-width:680px){.grid{grid-template-columns:1fr}.card{padding:15px}}

@media(min-width:681px){header{position:sticky;top:0;z-index:20}main{height:calc(100dvh - 57px);padding-bottom:12px}.grid{height:100%;align-items:start}.grid>section.card{position:sticky;top:0;max-height:100%;overflow-y:auto}.activity-column{height:100%;overflow-y:auto;overscroll-behavior:contain;padding-right:6px;scrollbar-gutter:stable}}
</style></head><body>
<header><a href="index.html">LT · LingoTotal</a><strong>Olivia · Reading</strong><a href="index.html" aria-label="Home">⌂</a></header>
<main><div class="grid"><section class="card"><h2>Meet Olivia</h2><div class="video"><video id="teacherVideo" autoplay playsinline aria-label="Olivia, interactive teacher"></video></div><p id="avatarStatus" class="status" role="status" aria-live="polite"></p><button id="connect">Start with Olivia</button><button id="disconnect" class="secondary" disabled>End session</button></section>
<div class="activity-column"><section class="card"><h2>1 · Choose your topic</h2><label for="topic">What would you like to talk about?</label><input id="topic" maxlength="120" placeholder="For example, visiting a market"><label for="details">Anything else Olivia should know? (optional)</label><textarea id="details" maxlength="300"></textarea><button id="create">Create my reading</button><p id="generationStatus" class="status" role="status"></p></section>
<section class="card hide" id="lesson"><h2>2 · Listen to Olivia</h2><p class="muted">Listen to the Spanish text, then record yourself reading it.</p><div id="readingText" class="text" lang="es"></div><button id="readText">Hear Olivia read it again</button>
<div id="recordPanel"><h2 style="margin-top:26px">3 · Read it aloud</h2><p class="muted">Press the orange button, then read the text. Stop and listen to your recording.</p><button id="record" style="background:#bc6a14">● Start recording</button><button id="stopRecord" class="secondary" disabled>Stop recording</button><p id="recordStatus" class="status" role="status" aria-live="polite"></p><audio id="playback" controls class="hide"></audio><button id="skipRecord" class="secondary">Continue without recording</button></div>
<div id="quiz" class="hide"><h2>4 · Quick quiz</h2><p id="question" class="text" lang="en"></p><div id="options" class="options"></div><button id="check" disabled>Check answer</button><p id="quizStatus" class="status" role="status"></p><div id="feedback" class="feedback hide"></div><button id="newText" class="secondary">Choose another topic</button></div></section></div></div></main>
<script type="module">
import {createClient,AnamEvent} from 'https://esm.sh/@anam-ai/js-sdk@4.26.0';
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);
const normalize=value=>({English:'en',Spanish:'es',Español:'es'})[value]||String(value||'').slice(0,2).toLowerCase();
const target=normalize(params.get('target')||localStorage.getItem('targetLang')||localStorage.getItem('lingototal_target_language')||'es');
let client=null,lesson=null,speech=Promise.resolve(),recorder=null,stream=null,chunks=[],audioUrl=null,selected=-1,quizDone=false;
if(target!=='es'){$('avatarStatus').textContent='This Olivia pilot teaches Spanish. Select Spanish on the home page.';$('connect').disabled=$('create').disabled=true}
async function speak(text){if(!client)return false;const current=client;speech=speech.catch(()=>{}).then(()=>current===client?current.talk(text):undefined);await speech;return true}
const welcome='My name is Olivia and I can help you speak Spanish. Type in the topic you want to talk about and then press the blue button.';
async function connect(){if(client)return;$('connect').disabled=true;$('avatarStatus').textContent='Connecting to Olivia…';let pending;try{const response=await fetch('/.netlify/functions/anam-session',{method:'POST'}),data=await response.json();if(!response.ok)throw Error(data.error||'Olivia is unavailable.');pending=createClient(data.sessionToken,{disableInputAudio:true});let resolveReady;const ready=new Promise(resolve=>resolveReady=resolve);pending.addListener(AnamEvent.SESSION_READY,resolveReady);pending.addListener(AnamEvent.CONNECTION_CLOSED,()=>{if(client===pending){client=null;$('connect').disabled=false;$('disconnect').disabled=true;$('avatarStatus').textContent='Olivia disconnected. Try again.'}});await pending.streamToVideoElement('teacherVideo');await Promise.race([ready,new Promise((_,reject)=>setTimeout(()=>reject(Error('Olivia did not become ready.')),25000))]);client=pending;$('disconnect').disabled=false;$('avatarStatus').textContent='Olivia is ready.';await speak(welcome);if(lesson)await speak(lesson.text)}catch(error){if(pending&&!client)try{await pending.stopStreaming()}catch{}$('avatarStatus').textContent=error.message;$('connect').disabled=false}}
async function disconnect(){const old=client;client=null;$('connect').disabled=false;$('disconnect').disabled=true;$('avatarStatus').textContent='';if(old)try{await old.stopStreaming()}catch{}}
$('connect').onclick=connect;$('disconnect').onclick=disconnect;window.addEventListener('pagehide',()=>{if(stream)stream.getTracks().forEach(track=>track.stop());if(audioUrl)URL.revokeObjectURL(audioUrl);disconnect()});
async function gemini(prompt){const response=await fetch('/.netlify/functions/gemini',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt,maxOutputTokens:1000,temperature:.45})});const data=await response.json();if(!response.ok)throw Error(data.error||'Could not generate the reading.');return data.text||data.candidates?.[0]?.content?.parts?.[0]?.text||''}
function json(raw){return JSON.parse(raw.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'').trim())}
$('create').onclick=async()=>{const topic=$('topic').value.trim();if(!topic){$('generationStatus').textContent='Enter a topic first.';return}$('create').disabled=true;$('generationStatus').textContent='Creating your reading…';try{const data=json(await gemini(`Return ONLY a JSON object with "text", "question", "options", "correctIndex", "explanation". Create an original, coherent 35–45 word reading in simple natural SPANISH about ${JSON.stringify(topic)}. Additional details: ${JSON.stringify($('details').value.trim())}. Adult false beginners. "question" must be ONE short multiple-choice comprehension question IN ENGLISH. "options" must be an array of exactly three distinct plausible answers IN ENGLISH, one unambiguously correct. "correctIndex" is its zero-based index. "explanation" is one short feedback sentence IN ENGLISH tied to the actual reading and correct option. No markdown.`));if(typeof data.text!=='string'||data.text.length<80||typeof data.question!=='string'||!Array.isArray(data.options)||data.options.length!==3||data.options.some(v=>typeof v!=='string')||![0,1,2].includes(data.correctIndex)||typeof data.explanation!=='string')throw Error('The reading was incomplete. Please try again.');lesson=data;selected=-1;quizDone=false;$('readingText').textContent=data.text;$('question').textContent=data.question;$('options').replaceChildren();data.options.forEach((option,index)=>{const button=document.createElement('button');button.type='button';button.textContent=option;button.onclick=()=>{if(quizDone)return;selected=index;document.querySelectorAll('#options button').forEach((element,i)=>element.classList.toggle('chosen',i===index));$('check').disabled=false};$('options').append(button)});$('quiz').classList.add('hide');$('feedback').classList.add('hide');$('quizStatus').textContent='';$('check').disabled=true;$('lesson').classList.remove('hide');$('lesson').scrollIntoView({behavior:'smooth'});$('generationStatus').textContent='';if(client){await speak('Now listen to the text in Spanish. Afterward, record yourself reading it.');await speak(data.text)}else $('avatarStatus').textContent='The text is ready. Start Olivia to hear it.'}catch(error){$('generationStatus').textContent=error.message}finally{$('create').disabled=false}};
$('readText').onclick=()=>{if(lesson)speak(lesson.text)};
function revealQuiz(){if(!lesson)return;$('quiz').classList.remove('hide');$('quiz').scrollIntoView({behavior:'smooth',block:'start'})}
function releaseMic(){if(stream){stream.getTracks().forEach(track=>track.stop());stream=null}}
$('record').onclick=async()=>{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){$('recordStatus').textContent='Recording is not available in this browser. You can still take the quiz.';return}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});const type=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(value=>MediaRecorder.isTypeSupported(value));recorder=new MediaRecorder(stream,type?{mimeType:type}:undefined);chunks=[];recorder.ondataavailable=event=>{if(event.data.size)chunks.push(event.data)};recorder.onstop=()=>{releaseMic();if(audioUrl)URL.revokeObjectURL(audioUrl);const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});audioUrl=URL.createObjectURL(blob);$('playback').src=audioUrl;$('playback').classList.remove('hide');$('recordStatus').textContent='Your recording is ready. Listen to it, then try the quiz.';revealQuiz()};recorder.start();$('record').disabled=true;$('stopRecord').disabled=false;$('recordStatus').innerHTML='<span class="recording">● Recording now — begin reading.</span>'}catch(error){releaseMic();$('recordStatus').textContent='Microphone access was unavailable. You can continue to the quiz.'}};
$('stopRecord').onclick=()=>{if(recorder?.state==='recording'){recorder.stop();$('record').disabled=false;$('stopRecord').disabled=true}};
$('skipRecord').onclick=revealQuiz;
$('check').onclick=async()=>{if(!lesson||selected<0||quizDone)return;quizDone=true;$('check').disabled=true;const correct=selected===lesson.correctIndex;const message=(correct?'That is correct. ':'Not quite. The correct answer is: '+lesson.options[lesson.correctIndex]+'. ')+lesson.explanation;$('feedback').textContent=message;$('feedback').classList.remove('hide');$('quizStatus').textContent=client?'Olivia is giving feedback…':'Connect Olivia to hear the feedback.';await speak(message);if(client)$('quizStatus').textContent='';};
$('newText').onclick=()=>{if(recorder?.state==='recording')recorder.stop();$('lesson').classList.add('hide');$('topic').focus();window.scrollTo({top:0,behavior:'smooth'})};
</script></body></html>
