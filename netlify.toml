[functions]
  directory = "functions"

# WizPoem pages use wizpoem.com; the edge router keeps page navigation on its own domain.
[[redirects]]
  from = "http://www.wizpoem.com/*"
  to = "https://wizpoem.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.wizpoem.com/*"
  to = "https://wizpoem.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://wizpoem.com/*"
  to = "https://wizpoem.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://wizpoem.com/"
  to = "/wizpoem-home.html"
  status = 200
  force = true

[[redirects]]
  from = "https://wizpoem.com/index.html"
  to = "/wizpoem-home.html"
  status = 200
  force = true

[[redirects]]
  from = "https://wizpoem.com/index"
  to = "/wizpoem-home.html"
  status = 200
  force = true

[[redirects]]
  from = "https://wizpoem.com/index/"
  to = "/wizpoem-home.html"
  status = 200
  force = true
