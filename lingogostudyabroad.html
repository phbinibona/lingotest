<style>

.header-tools{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}.language-pair{padding:8px 12px;border:1px solid rgba(255,255,255,.5);border-radius:9px;background:rgba(255,255,255,.12);font-size:.78rem;font-weight:700}.home-link{display:inline-flex;align-items:center;gap:7px;padding:9px 12px;border-radius:9px;background:#fff;color:var(--primary-dark);text-decoration:none;font-size:.78rem;font-weight:800}
.page{width:min(860px,calc(100% - 22px));margin:20px auto 40px}.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:clamp(16px,3vw,28px);margin-bottom:18px}

input[type=text]{width:100%;min-height:48px;padding:11px 13px;border:2px solid var(--border);border-radius:var(--radius-sm)}input[type=text]:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 4px rgba(18,103,214,.13)}
.examples-wrap{margin-top:15px;padding-top:12px;border-top:1px dashed #d6deea}.helper{font-size:.78rem;color:#7b8796}.example-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}.quiet-examples .choice{padding:8px 7px;border:1px solid #e0e6ee;background:#f8fafc;color:#657181;font-size:.78rem}
.primary-btn,.secondary-btn{border:0;border-radius:11px;padding:13px 18px;font-weight:800;cursor:pointer}.primary-btn{width:100%;background:linear-gradient(135deg,var(--primary-dark),var(--primary));color:#fff}.secondary-btn{background:#fff;border:1px solid var(--border);color:var(--ink)}.status{display:none;text-align:center;margin:16px 0;color:var(--muted)}
.activity{display:none}.situation{font-weight:800;font-size:1.08rem;margin-bottom:14px}.intentions{display:grid;gap:9px}.intent{width:100%;text-align:left;padding:13px 14px;border:2px solid var(--border);border-radius:11px;background:#fff;cursor:pointer;font-weight:700}.intent:hover,.intent.selected{border-color:var(--primary);background:var(--primary-light)}
.responses{display:none;margin-top:16px}.response-card{padding:14px;border:1px solid var(--border);border-radius:12px;background:#fff;margin-bottom:10px}.response-text{font-weight:800;font-size:1.05rem}.response-note{margin-top:6px;color:var(--muted);font-size:.9rem}.response-translation{display:none;margin-top:9px;padding:9px 11px;border-radius:8px;background:var(--soft);font-size:.93rem;font-weight:700}.response-translation.visible{display:block}.response-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.response-actions button{border:1px solid var(--border);background:var(--soft);border-radius:8px;padding:8px 10px;cursor:pointer;font-weight:700}
.collection-bar{display:flex;justify-content:flex-end;margin:0 0 14px}.collection-btn{border:0;border-radius:10px;padding:10px 14px;background:#fff;color:var(--primary-dark);font-weight:800;cursor:pointer;box-shadow:var(--shadow)}.collection-panel{display:none}.collection-list{display:grid;gap:10px;margin-top:14px}.collection-item{padding:12px;border:1px solid var(--border);border-radius:11px;background:#fff}.collection-sentence{font-weight:800}.collection-meta{font-size:.78rem;color:var(--muted);margin-top:4px}

/* Separate Home shortcut: keep the existing Activities / change languages control,
   with a compact home icon at the far right. */
.home-icon{
  width:42px;
  height:42px;
  flex:0 0 42px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  background:#fff;
  color:#084ca8;
  text-decoration:none;
  border:1px solid rgba(255,255,255,.45);
  box-sizing:border-box;
  transition:transform .15s ease, background .15s ease;
}
.home-icon svg{
  width:24px;
  height:24px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.home-icon:hover{transform:translateY(-1px);background:#f5f9ff}
.home-icon:focus-visible{outline:3px solid rgba(255,255,255,.7);outline-offset:2px}
@media(max-width:520px){
  .home-icon{width:42px;height:42px;flex-basis:42px}
}


/* ===== LINGOGO / TOURISM — job-ready treatment ===== */
:root{
  --design-black:#101010;
  --design-paper:#f4f0e8;
  --design-white:#fffdf8;
  --design-red:#6c4be3;
  --design-line:#bdb8ae;
  --design-grey:#6f6c66;
}

body{
  background:
    linear-gradient(rgba(16,16,16,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(16,16,16,.035) 1px, transparent 1px),
    var(--design-paper);
  background-size:28px 28px;
  color:var(--design-black);
}

.banner{
  background:var(--design-black);
  box-shadow:none;
  border-bottom:5px solid var(--design-red);
}

.brand-mark{
  border-radius:0;
  background:var(--design-red);
  color:#fff;
  box-shadow:none;
  font-weight:900;
}

.brand{letter-spacing:.12em;font-weight:900}
.tagline{font-family:inherit;letter-spacing:.05em;text-transform:uppercase;opacity:.72}
.language-pair{border-radius:0;border-color:#6c6c6c;background:transparent}
.home-link,.home-icon{
  border-radius:0 !important;
  background:#fff !important;
  color:#111 !important;
  border:0 !important;
  box-shadow:none !important;
}

.page{width:min(980px,calc(100% - 24px))}
.panel{
  border-radius:0;
  box-shadow:none;
  border:1.5px solid var(--design-black);
  background:var(--design-white);
}
.hero{
  position:relative;
  overflow:hidden;
  min-height:230px;
  display:grid;
  grid-template-columns:minmax(0,1.5fr) minmax(180px,.7fr);
  align-items:end;
  gap:28px;
  background:var(--design-white);
}
.hero:after{
  content:"LINGOGO";
  align-self:stretch;
  display:flex;
  align-items:flex-end;
  justify-content:flex-end;
  padding:0 0 4px;
  color:var(--design-red);
  font-size:clamp(2.2rem,6vw,5.8rem);
  font-weight:900;
  line-height:.84;
  letter-spacing:-.06em;
  text-align:right;
  max-width:7ch;
  word-break:break-word;
}
h1{
  font-size:clamp(2.4rem,7vw,5.7rem);
  line-height:.88;
  letter-spacing:-.055em;
  text-transform:uppercase;
  max-width:8ch;
  margin-bottom:18px;
}
.hero p{
  max-width:60ch;
  color:#45423d;
  font-size:1rem;
}
.design-kicker{
  margin:0 0 12px;
  color:var(--design-red);
  font-size:.78rem;
  font-weight:900;
  letter-spacing:.16em;
  text-transform:uppercase;
}
.design-disclaimer{
  margin-top:14px;
  font-size:.72rem;
  color:var(--design-grey);
}

.section-head{align-items:flex-start}
.number{
  border-radius:0;
  background:var(--design-black);
  color:#fff;
  font-weight:900;
}
.section-title{
  font-size:1.28rem;
  text-transform:uppercase;
  letter-spacing:.02em;
  font-weight:900;
}
.setup-lead{color:#55514b}
.level-grid{gap:0;border:1.5px solid var(--design-black)}
.level-card{
  border:0;
  border-right:1.5px solid var(--design-black);
  border-radius:0;
  background:#fff;
  min-height:132px;
}
.level-card:last-child{border-right:0}
.level-card:hover,.level-card.selected{
  background:var(--design-black);
  color:#fff;
  border-color:var(--design-black);
}
.level-card.selected .level-note,.level-card:hover .level-note{color:#d8d8d8}
.level-name{text-transform:uppercase;letter-spacing:.02em}
.topic-step{border-top:1.5px solid var(--design-black)}
.substep-badge{border-radius:0;background:var(--design-red);color:#fff}
.topic-label{text-transform:uppercase;letter-spacing:.02em}
input[type=text]{
  border-radius:0;
  border:1.5px solid var(--design-black);
  min-height:58px;
  background:#fff;
  font-size:1.02rem;
}
input[type=text]:focus{
  border-color:var(--design-red);
  box-shadow:0 0 0 3px rgba(226,75,53,.15);
}
.examples-wrap{border-top:1px solid var(--design-line)}
.quiet-examples .choice{
  border-radius:0;
  border:1px solid var(--design-line);
  background:#f7f4ed;
}
.choice:hover,.choice.selected,
.quiet-examples .choice:hover,.quiet-examples .choice.selected{
  background:var(--design-red);
  border-color:var(--design-red);
  color:#fff;
}
.primary-btn{
  border-radius:0;
  background:var(--design-red);
  text-transform:uppercase;
  letter-spacing:.06em;
}
.secondary-btn,.response-actions button,.collection-btn{
  border-radius:0;
  box-shadow:none;
}
.collection-btn{
  background:var(--design-black);
  color:#fff;
}
.activity{border-top:6px solid var(--design-red)}
.situation{
  font-size:clamp(1.45rem,4vw,2.3rem);
  line-height:1.05;
  letter-spacing:-.025em;
  max-width:28ch;
}
.intentions{
  grid-template-columns:repeat(3,1fr);
  gap:0;
  border:1.5px solid var(--design-black);
}
.intent{
  min-height:92px;
  border:0;
  border-right:1.5px solid var(--design-black);
  border-radius:0;
  background:#fff;
  text-transform:uppercase;
  letter-spacing:.025em;
  font-weight:900;
}
.intent:last-child{border-right:0}
.intent:hover,.intent.selected{
  background:var(--design-black);
  color:#fff;
}
.response-card{
  border-radius:0;
  border:1.5px solid var(--design-black);
  background:#fff;
  padding:18px;
}
.response-card:nth-child(odd){margin-left:0;margin-right:8%}
.response-card:nth-child(even){margin-left:8%;margin-right:0}
.response-text{
  font-size:clamp(1.18rem,3vw,1.7rem);
  line-height:1.18;
  letter-spacing:-.02em;
}
.response-note{
  border-top:1px solid var(--design-line);
  padding-top:9px;
}
.design-context-wrap{
  margin:22px 0 8px;
  padding-top:20px;
  border-top:1.5px solid var(--design-black);
}
.design-context-label{
  margin-bottom:9px;
  font-size:.78rem;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.12em;
}
.design-context-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:0;
  border:1.5px solid var(--design-black);
}
.design-context{
  min-height:92px;
  border:0;
  border-right:1.5px solid var(--design-black);
  border-bottom:1.5px solid var(--design-black);
  background:#fff;
  padding:12px;
  text-align:left;
  cursor:pointer;
}
.design-context:nth-child(3n){border-right:0}
.design-context:nth-last-child(-n+3){border-bottom:0}
.design-context:hover,.design-context.selected{
  background:var(--design-red);
  color:#fff;
}
.design-context strong{
  display:block;
  font-size:1rem;
  text-transform:uppercase;
  letter-spacing:.025em;
}
.design-context span{
  display:block;
  margin-top:5px;
  font-size:.76rem;
  line-height:1.28;
  opacity:.78;
}
.design-fields{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:14px;
}
.design-chip{
  padding:5px 8px;
  border:1px solid var(--design-black);
  font-size:.68rem;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.05em;
  background:#fff;
}
.footer{
  color:#4f4b46;
  text-transform:uppercase;
  letter-spacing:.08em;
}

@media(max-width:700px){
  .hero{grid-template-columns:1fr;min-height:0}
  .hero:after{display:none}
  .level-grid{grid-template-columns:1fr}
  .level-card{border-right:0;border-bottom:1.5px solid var(--design-black)}
  .level-card:last-child{border-bottom:0}
  .design-context-grid{grid-template-columns:1fr}
  .design-context{border-right:0 !important;border-bottom:1.5px solid var(--design-black) !important}
  .design-context:last-child{border-bottom:0 !important}
  .intentions{grid-template-columns:1fr}
  .intent{border-right:0;border-bottom:1.5px solid var(--design-black)}
  .intent:last-child{border-bottom:0}
  .response-card:nth-child(n){margin-left:0;margin-right:0}
}

.level-first-note{font-weight:800;margin:8px 0 12px;color:#26364a}.theme-any-language-note{font-weight:700;margin:10px 0 6px;color:#526174}
</style>
</head>

<p class="topic-guidance" data-i18n="topicGuidance"></p>

</div></div>

<div class="responses" id="responses"></div>

</div>
</section>

function parseJSON(text){const clean=String(text||'').replace(/```json/gi,'').replace(/```/g,'').trim();const start=clean.indexOf('{'),end=clean.lastIndexOf('}');if(start<0||end<0)throw new Error('AI format error');const d=JSON.parse(clean.slice(start,end+1));if(!Array.isArray(d.situations)||d.situations.length<3)throw new Error('AI format error');return d.situations.slice(0,4).map(s=>{s.situation=String(s.situation||'').trim();if(!s.situation||!Array.isArray(s.intentions)||s.intentions.length<3)throw new Error('AI situation format error');s.intentions=s.intentions.slice(0,3).map(i=>{i.label=String(i.label||'').trim();if(!i.label||!Array.isArray(i.responses)||i.responses.length<2)throw new Error('AI intention format error');i.responses=i.responses.slice(0,2).map(r=>({text:String(r?.text||'').trim(),note:String(r?.note||'').trim(),translation:String(r?.translation||'').trim()}));if(i.responses.some(r=>!r.text))throw new Error('AI response format error');return i});return s})}

Learner's need: "${theme}"
Study-abroad context: ${studyContext}
Level: ${level}.

The pedagogical focus is COMMUNICATIVE INTENTION IN STUDY-ABROAD LIFE. The learner decides what they need to communicate and then discovers short, natural, useful language for real academic, social and everyday situations.

Use realistic contexts where relevant: university enrolment and administration, timetables, libraries and student services, seminars, lectures, tutorials, asking for clarification, contributing an opinion, group work, speaking to tutors, accommodation, landlords or residence staff, flatmates, making friends, invitations, clubs and societies, transport, appointments, shopping, banking-type everyday enquiries without financial advice, healthcare reception without medical advice, travel, internships, placements and part-time work.
