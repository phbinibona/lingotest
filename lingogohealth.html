/* Separate Home shortcut: keep the existing Activities / change languages control,
   with a compact home icon at the far right. */
.home-icon{
  width:42px;
  height:42px;
  flex:0 0 42px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  background:#fff;
  color:#084ca8;
  text-decoration:none;
  border:1px solid rgba(255,255,255,.45);
  box-sizing:border-box;
  transition:transform .15s ease, background .15s ease;
}
.home-icon svg{
  width:24px;
  height:24px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.home-icon:hover{transform:translateY(-1px);background:#f5f9ff}
.home-icon:focus-visible{outline:3px solid rgba(255,255,255,.7);outline-offset:2px}
@media(max-width:520px){
  .home-icon{width:42px;height:42px;flex-basis:42px}
}


/* ===== LINGOGO / RETAIL — job-ready treatment ===== */
:root{
  --design-black:#101010;
  --design-paper:#f4f0e8;
  --design-white:#fffdf8;
  --design-red:#e24b35;
  --design-line:#bdb8ae;
  --design-grey:#6f6c66;
}

body{
  background:
    linear-gradient(rgba(16,16,16,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(16,16,16,.035) 1px, transparent 1px),
    var(--design-paper);
  background-size:28px 28px;
  color:var(--design-black);
}

.banner{
  background:var(--design-black);
  box-shadow:none;
  border-bottom:5px solid var(--design-red);
}

.brand-mark{
  border-radius:0;
  background:var(--design-red);
  color:#fff;
  box-shadow:none;
  font-weight:900;
}

.brand{letter-spacing:.12em;font-weight:900}
.tagline{font-family:inherit;letter-spacing:.05em;text-transform:uppercase;opacity:.72}
.language-pair{border-radius:0;border-color:#6c6c6c;background:transparent}
.home-link,.home-icon{
  border-radius:0 !important;
  background:#fff !important;
  color:#111 !important;
  border:0 !important;
  box-shadow:none !important;
}

.page{width:min(980px,calc(100% - 24px))}
.panel{
  border-radius:0;
  box-shadow:none;
  border:1.5px solid var(--design-black);
  background:var(--design-white);
}
.hero{
  position:relative;
  overflow:hidden;
  min-height:230px;
  display:grid;
  grid-template-columns:minmax(0,1.5fr) minmax(180px,.7fr);
  align-items:end;
  gap:28px;
  background:var(--design-white);
}
.hero:after{
  content:"LINGOGO";
  align-self:stretch;
  display:flex;
  align-items:flex-end;
  justify-content:flex-end;
  padding:0 0 4px;
  color:var(--design-red);
  font-size:clamp(2.2rem,6vw,5.8rem);
  font-weight:900;
  line-height:.84;
  letter-spacing:-.06em;
  text-align:right;
  max-width:7ch;
  word-break:break-word;
}
h1{
  font-size:clamp(2.4rem,7vw,5.7rem);
  line-height:.88;
  letter-spacing:-.055em;
  text-transform:uppercase;
  max-width:8ch;
  margin-bottom:18px;
}
.hero p{
  max-width:60ch;
  color:#45423d;
  font-size:1rem;
}
.design-kicker{
  margin:0 0 12px;
  color:var(--design-red);
  font-size:.78rem;
  font-weight:900;
  letter-spacing:.16em;
  text-transform:uppercase;
}
.design-disclaimer{
  margin-top:14px;
  font-size:.72rem;
  color:var(--design-grey);
}

.section-head{align-items:flex-start}
.number{
  border-radius:0;
  background:var(--design-black);
  color:#fff;
  font-weight:900;
}
.section-title{
  font-size:1.28rem;
  text-transform:uppercase;
  letter-spacing:.02em;
  font-weight:900;
}
.setup-lead{color:#55514b}
.level-grid{gap:0;border:1.5px solid var(--design-black)}
.level-card{
  border:0;
  border-right:1.5px solid var(--design-black);
  border-radius:0;
  background:#fff;
  min-height:132px;
}
.level-card:last-child{border-right:0}
.level-card:hover,.level-card.selected{
  background:var(--design-black);
  color:#fff;
  border-color:var(--design-black);
}
.level-card.selected .level-note,.level-card:hover .level-note{color:#d8d8d8}
.level-name{text-transform:uppercase;letter-spacing:.02em}
.topic-step{border-top:1.5px solid var(--design-black)}
.substep-badge{border-radius:0;background:var(--design-red);color:#fff}
.topic-label{text-transform:uppercase;letter-spacing:.02em}
input[type=text]{
  border-radius:0;
  border:1.5px solid var(--design-black);
  min-height:58px;
  background:#fff;
  font-size:1.02rem;
}
input[type=text]:focus{
  border-color:var(--design-red);
  box-shadow:0 0 0 3px rgba(226,75,53,.15);
}
.examples-wrap{border-top:1px solid var(--design-line)}
.quiet-examples .choice{
  border-radius:0;
  border:1px solid var(--design-line);
  background:#f7f4ed;
}
.choice:hover,.choice.selected,
.quiet-examples .choice:hover,.quiet-examples .choice.selected{
  background:var(--design-red);
  border-color:var(--design-red);
  color:#fff;
}
.primary-btn{
  border-radius:0;
  background:var(--design-red);
  text-transform:uppercase;
  letter-spacing:.06em;
}
.secondary-btn,.response-actions button,.collection-btn{
  border-radius:0;
  box-shadow:none;
}
.collection-btn{
  background:var(--design-black);
  color:#fff;
}
.activity{border-top:6px solid var(--design-red)}
.situation{
  font-size:clamp(1.45rem,4vw,2.3rem);
  line-height:1.05;
  letter-spacing:-.025em;
  max-width:28ch;
}
.intentions{
  grid-template-columns:repeat(3,1fr);
  gap:0;
  border:1.5px solid var(--design-black);
}
.intent{
  min-height:92px;
  border:0;
  border-right:1.5px solid var(--design-black);
  border-radius:0;
  background:#fff;
  text-transform:uppercase;
  letter-spacing:.025em;
  font-weight:900;
}
.intent:last-child{border-right:0}
.intent:hover,.intent.selected{
  background:var(--design-black);
  color:#fff;
}
.response-card{
  border-radius:0;
  border:1.5px solid var(--design-black);
  background:#fff;
  padding:18px;
}
.response-card:nth-child(odd){margin-left:0;margin-right:8%}
.response-card:nth-child(even){margin-left:8%;margin-right:0}
.response-text{
  font-size:clamp(1.18rem,3vw,1.7rem);
  line-height:1.18;
  letter-spacing:-.02em;
}
.response-note{
  border-top:1px solid var(--design-line);
  padding-top:9px;
}
.design-context-wrap{
  margin:22px 0 8px;
  padding-top:20px;
  border-top:1.5px solid var(--design-black);
}
.design-context-label{
  margin-bottom:9px;
  font-size:.78rem;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.12em;
}
.design-context-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:0;
  border:1.5px solid var(--design-black);
}
.design-context{
  min-height:92px;
  border:0;
  border-right:1.5px solid var(--design-black);
  border-bottom:1.5px solid var(--design-black);
  background:#fff;
  padding:12px;
  text-align:left;
  cursor:pointer;
}
.design-context:nth-child(3n){border-right:0}
.design-context:nth-last-child(-n+3){border-bottom:0}
.design-context:hover,.design-context.selected{
  background:var(--design-red);
  color:#fff;
}
.design-context strong{
  display:block;
  font-size:1rem;
  text-transform:uppercase;
  letter-spacing:.025em;
}
.design-context span{
  display:block;
  margin-top:5px;
  font-size:.76rem;
  line-height:1.28;
  opacity:.78;
}
.design-fields{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:14px;
}
.design-chip{
  padding:5px 8px;
  border:1px solid var(--design-black);
  font-size:.68rem;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.05em;
  background:#fff;
}
.footer{
  color:#4f4b46;
  text-transform:uppercase;
  letter-spacing:.08em;
}

@media(max-width:700px){
  .hero{grid-template-columns:1fr;min-height:0}
  .hero:after{display:none}
  .level-grid{grid-template-columns:1fr}
  .level-card{border-right:0;border-bottom:1.5px solid var(--design-black)}
  .level-card:last-child{border-bottom:0}
  .design-context-grid{grid-template-columns:1fr}
  .design-context{border-right:0 !important;border-bottom:1.5px solid var(--design-black) !important}
  .design-context:last-child{border-bottom:0 !important}
  .intentions{grid-template-columns:1fr}
  .intent{border-right:0;border-bottom:1.5px solid var(--design-black)}
  .intent:last-child{border-bottom:0}
  .response-card:nth-child(n){margin-left:0;margin-right:0}
}


/* Health page compatibility while retaining the Retail visual system */
.level-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}.topic-step{margin-top:18px}.topic-step>div:last-child{min-width:0}.topic-step input{width:100%}.health-disclaimer{margin-top:14px;padding:10px 12px;border-radius:11px;background:#f7fafc;border:1px solid var(--border);color:var(--muted);font-size:.76rem}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.actions button{border:1px solid #cbd7e6;background:#fff;color:var(--ink);border-radius:9px;padding:8px 10px;font:inherit;font-size:.72rem;font-weight:800;cursor:pointer}.actions button:hover{background:var(--primary-light)}.translation{margin-top:8px;padding:9px 10px;border-radius:9px;background:var(--soft);color:var(--muted);font-size:.78rem}.next-wrap{margin-top:14px}.collection-panel.show{display:block}.status.show{display:block}.spinner{width:22px;height:22px;border:3px solid #cfe0f7;border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin-right:8px;display:inline-block;vertical-align:middle}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:360px){.level-grid{grid-template-columns:1fr!important}}
</style>

const params=new URLSearchParams(location.search);let uiLanguage=params.get('ui')||localStorage.getItem('lingototal_ui_language')||'en';let targetLanguage=params.get('target')||localStorage.getItem('lingototal_target_language')||'English';if(!T[uiLanguage])uiLanguage='en';if(!targetNames[targetLanguage])targetLanguage='English';localStorage.setItem('lingototal_ui_language',uiLanguage);localStorage.setItem('lingototal_target_language',targetLanguage);
const $=id=>document.getElementById(id),tr=k=>(T[uiLanguage]||T.en)[k]||T.en[k]||k;let selectedLevel='',situations=[],current=0;
function applyLanguage(){document.documentElement.lang=uiLanguage;document.documentElement.dir=uiLanguage==='ar'?'rtl':'ltr';document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=tr(el.dataset.i18n));document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>el.placeholder=tr(el.dataset.i18nPlaceholder));$('languagePair').textContent=uiNames[uiLanguage]+' → '+targetNames[targetLanguage];document.title='LingoTotal · '+tr('title')}
function notice(msg){const n=$('notice');n.textContent=msg;n.classList.add('show');clearTimeout(notice.t);notice.t=setTimeout(()=>n.classList.remove('show'),3000)}
document.querySelectorAll('.level').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.level').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');selectedLevel=btn.dataset.level});
async function callGemini(prompt){const r=await fetch('/.netlify/functions/gemini',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,model:'gemini-2.5-flash',temperature:.65})});let d;try{d=await r.json()}catch{throw new Error('Invalid server response')}if(!r.ok)throw new Error(d?.error||'Server error');const text=d?.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('')||'';if(!text)throw new Error('Empty AI response');return text}
function parseJSON(text){const clean=String(text).replace(/```json/gi,'').replace(/```/g,'').trim();const a=clean.indexOf('{'),b=clean.lastIndexOf('}');if(a<0||b<0)throw new Error('AI format error');const d=JSON.parse(clean.slice(a,b+1));const rows=(Array.isArray(d.situations)?d.situations:[]).slice(0,3).map(s=>({situation:String(s.situation||'').trim(),intentions:(Array.isArray(s.intentions)?s.intentions:[]).slice(0,3).map(i=>({label:String(i.label||'').trim(),responses:(Array.isArray(i.responses)?i.responses:[]).slice(0,2).map(r=>({text:String(r.text||'').trim(),note:String(r.note||'').trim()})).filter(r=>r.text)})).filter(i=>i.label&&i.responses.length)})).filter(s=>s.situation&&s.intentions.length);if(rows.length!==3)throw new Error('AI format error');return rows}
async function speak(text,lang=targetLanguage){try{await window.LingoTTS.speak(text,voiceLocales[lang]||'en-GB',.92)}catch{notice(tr('serverError'))}}
function renderSituation(){const s=situations[current];$('activity').style.display='block';$('waiting').style.display='none';$('progress').textContent=(current+1)+' / '+situations.length;$('situation').textContent=s.situation;$('intentions').innerHTML='';$('responses').innerHTML='';$('responses').style.display='none';$('nextWrap').style.display='none';$('nextBtn').textContent=current===situations.length-1?tr('newChallenge'):tr('next');s.intentions.forEach(intent=>{const b=document.createElement('button');b.className='intent';b.textContent=intent.label;b.onclick=()=>showResponses(intent,b);$('intentions').appendChild(b)})}
function showResponses(intent,btn){document.querySelectorAll('.intent').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');const box=$('responses');box.innerHTML='';box.style.display='block';intent.responses.forEach(r=>{const card=document.createElement('div');card.className='response-card';const text=document.createElement('div');text.className='response-text';text.textContent=r.text;const note=document.createElement('div');note.className='response-note';note.textContent=r.note;const actions=document.createElement('div');actions.className='actions';const l=document.createElement('button');l.textContent=tr('listen');l.onclick=()=>speak(r.text);const x=document.createElement('button');x.textContent=tr('translate');x.onclick=async()=>{x.disabled=true;try{const out=(await callGemini(`Translate this ${targetLanguage} sentence into ${uiNames[uiLanguage]}. Return only the translation: ${JSON.stringify(r.text)}`)).trim();let d=card.querySelector('.translation');if(!d){d=document.createElement('div');d.className='translation';card.insertBefore(d,actions)}d.textContent=tr('translation')+': '+out}catch{notice(tr('serverError'))}finally{x.disabled=false}};const save=document.createElement('button');save.textContent=tr('save');save.onclick=()=>saveSentence(r.text);actions.append(l,x,save);card.append(text,note,actions);box.appendChild(card)});$('nextWrap').style.display='block'}
$('nextBtn').onclick=()=>{if(current>=situations.length-1){situations=[];current=0;$('activity').style.display='none';$('waiting').style.display='block';$('themeInput').focus();$('themeInput').scrollIntoView({behavior:'smooth',block:'center'});return}current++;renderSituation()};
$('generateBtn').onclick=async()=>{const theme=$('themeInput').value.trim();if(!selectedLevel){notice(tr('selectLevel'));document.querySelector('.level').scrollIntoView({behavior:'smooth',block:'center'});return}if(!theme){notice(tr('enterTopic'));$('themeInput').focus();return}const level=selectedLevel==='beginner'?'Revising the basics: clear, supported, concise spoken language.':'Building confidence: natural everyday spoken language, flexible follow-up and slightly richer phrasing.';const prompt=`Create a LingoGo Health language-learning activity.\n\nINTERFACE LANGUAGE: ${uiNames[uiLanguage]}\nTARGET LANGUAGE: ${targetLanguage}\nLEVEL: ${level}\nLEARNER SUBMISSION: ${theme}\n\nNON-NEGOTIABLE CONTENT RULES:\n- The learner submission is authoritative. Build ONE need into exactly THREE closely related real-life situations.\n- Every situation, communicative intention and response must be recognisably about the learner's submission.\n- Do not replace the submission with generic health categories, unrelated symptoms, or a different medical scenario.\n- The three situations should explore different useful stages/aspects of the SAME need.\n- Use health contexts only where they genuinely support the learner's stated need: booking/checking in, describing symptoms, answering routine questions, tests, treatment discussions, pharmacy, prescriptions, dental care, accompanying another person, referrals, follow-up, or seeking urgent professional help.\n- This is language practice only. Do NOT diagnose, identify a condition, prescribe medication, recommend treatment, or claim medical certainty.\n- If the learner describes an emergency, focus on language for contacting appropriate emergency/professional help, not medical instructions.\n\nFOR EACH OF THE 3 SITUATIONS:\n- situation: in ${uiNames[uiLanguage]}\n- exactly 3 different communicative intentions, labels in ${uiNames[uiLanguage]}\n- each intention has exactly 2 short, natural spoken responses in ${targetLanguage}\n- each response has one brief note in ${uiNames[uiLanguage]} about tone/usefulness/nuance; do not translate the response in the note\n- prefer ordinary spoken language over textbook or technical medical wording\n\nReturn ONLY valid JSON in this exact structure:\n{"situations":[{"situation":"...","intentions":[{"label":"...","responses":[{"text":"...","note":"..."},{"text":"...","note":"..."}]}]}]}`;try{$('generateBtn').disabled=true;$('loading').classList.add('show');$('waiting').style.display='none';$('activity').style.display='none';situations=parseJSON(await callGemini(prompt));current=0;renderSituation()}catch(e){$('waiting').style.display='block';notice(tr('serverError')+' '+e.message)}finally{$('generateBtn').disabled=false;$('loading').classList.remove('show')}};
const KEY='lingototal_saved_sentences_v2';function getCollection(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return []}}function setCollection(a){localStorage.setItem(KEY,JSON.stringify(a));$('collectionCount').textContent=a.length}function saveSentence(sentence){const a=getCollection();if(a.some(x=>x.sentence===sentence&&x.targetLanguage===targetLanguage)){notice(tr('alreadySaved'));return}a.unshift({sentence,targetLanguage,targetName:targetNames[targetLanguage],theme:$('themeInput').value.trim(),source:'LingoGo Health'});setCollection(a);notice(tr('saved'))}function renderCollection(){const list=$('collectionList'),a=getCollection();list.innerHTML='';if(!a.length){list.textContent=tr('empty');return}a.forEach((x,i)=>{const row=document.createElement('div');row.className='collection-item';const s=document.createElement('div');s.className='collection-sentence';s.textContent=x.sentence||x.text||'';const m=document.createElement('div');m.className='collection-meta';m.textContent=(x.targetName||x.targetLanguage||'')+(x.theme?' · '+tr('theme')+': '+x.theme:'');const acts=document.createElement('div');acts.className='actions';const l=document.createElement('button');l.textContent=tr('listen');l.onclick=()=>speak(s.textContent,x.targetLanguage||targetLanguage);const r=document.createElement('button');r.textContent=tr('remove');r.onclick=()=>{a.splice(i,1);setCollection(a);renderCollection()};acts.append(l,r);row.append(s,m,acts);list.appendChild(row)})}$('openCollectionBtn').onclick=()=>{$('collectionPanel').classList.add('show');renderCollection();$('collectionPanel').scrollIntoView({behavior:'smooth',block:'start'})};$('closeCollectionBtn').onclick=()=>$('collectionPanel').classList.remove('show');
applyLanguage();setCollection(getCollection());
});
</script>
<script>
(function(){const cache=new Map();let audio=null;async function speak(text,language='en-GB',speakingRate=.95){if(audio){try{audio.pause()}catch{}}const key=language+'|'+speakingRate+'|'+text;let src=cache.get(key);if(!src){const r=await fetch('/.netlify/functions/google-tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,language,speakingRate})});if(!r.ok)throw new Error('Audio error');const blob=await r.blob();src=URL.createObjectURL(blob);cache.set(key,src)}audio=new Audio(src);await audio.play()}window.LingoTTS={speak}})();
</script>
</body>
