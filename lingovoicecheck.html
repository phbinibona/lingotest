<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalan voice check · LingoTotal</title><style>body{font:18px Arial,sans-serif;background:#171717;color:#fff;margin:0}main{max-width:650px;margin:40px auto;padding:20px}a{color:#aaceff}button,select{font:inherit;padding:12px;margin:10px 0;max-width:100%}button{background:#3277e8;color:white;border:0;cursor:pointer}select{display:block;width:100%}#details{white-space:pre-wrap;line-height:1.5}small{color:#cbd5e1}</style></head><body><main><a href="https://lingototal.com/">LingoTotal</a><h1>Check your Catalan voice</h1><p>Open this page in the same Chrome browser you use for vidcatala.</p><button id="load">Show Catalan voices</button><p id="status" role="status"></p><select id="voices" aria-label="Catalan voice" hidden></select><p id="details"></p><button id="listen" hidden>Hear a Catalan sample</button><p><small>This checks the voices available in your browser. Send me the displayed voice name. If there is more than one, try each and tell me which sounds like vidcatala.</small></p></main><script>
const synth=window.speechSynthesis,select=document.getElementById('voices'),status=document.getElementById('status'),details=document.getElementById('details'),listen=document.getElementById('listen');let voices=[],requested=false;
function describe(){const v=voices[Number(select.value)];if(!v)return;details.textContent='Voice: '+v.name+'\nLanguage: '+v.lang+'\n'+(v.localService?'Device voice':'Online voice');}
function show(){if(!synth){status.textContent='Speech voices are not available in this browser.';return}voices=synth.getVoices().filter(v=>/^ca(?:[-_]|$)/i.test(v.lang));select.replaceChildren();if(!voices.length){status.textContent='No named Catalan voice is available yet. Wait a moment and press Show Catalan voices again. The browser may use a fallback voice in vidcatala.';select.hidden=listen.hidden=true;return}voices.forEach((v,i)=>{const option=document.createElement('option');option.value=i;option.textContent=v.name+' ('+v.lang+')';select.append(option)});select.hidden=listen.hidden=false;status.textContent=voices.length===1?'One Catalan voice is available.':'More than one Catalan voice is available.';describe();}
document.getElementById('load').onclick=()=>{requested=true;show()};select.onchange=describe;if(synth)synth.addEventListener('voiceschanged',()=>{if(requested)show()});listen.onclick=()=>{const v=voices[Number(select.value)];if(!v)return;synth.cancel();const utterance=new SpeechSynthesisUtterance('Bon dia! Avui anirem al mercat i després passejarem pel poble.');utterance.lang='ca-ES';utterance.voice=v;utterance.rate=.9;utterance.onstart=()=>status.textContent='Playing: '+v.name;utterance.onend=()=>status.textContent='Voice: '+v.name;utterance.onerror=()=>status.textContent='This voice could not play. Try another voice.';synth.speak(utterance)};
</script></body></html>
