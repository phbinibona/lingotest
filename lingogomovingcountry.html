.brand-wrap{display:flex;align-items:center;gap:12px}.brand-mark{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:#fff;color:var(--primary);font-weight:800;box-shadow:0 6px 14px rgba(0,0,0,.18)}.brand{font-size:1.35rem;font-weight:800;letter-spacing:.055em}.tagline{font-size:.78rem;opacity:.9}
.header-tools{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}.language-pair{padding:8px 12px;border:1px solid rgba(255,255,255,.5);border-radius:9px;background:rgba(255,255,255,.12);font-size:.78rem;font-weight:700}.home-link{display:inline-flex;align-items:center;gap:7px;padding:9px 12px;border-radius:9px;background:#fff;color:var(--primary-dark);text-decoration:none;font-size:.78rem;font-weight:800}
.page{width:min(860px,calc(100% - 22px));margin:20px auto 40px}.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:clamp(16px,3vw,28px);margin-bottom:18px}
.hero{background:linear-gradient(135deg,#fff,#edf5ff)}h1{margin:0 0 7px;font-size:clamp(1.55rem,4vw,2.15rem);line-height:1.16}.hero p{margin:0;color:var(--muted)}
.section-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}.number{width:36px;height:36px;flex:0 0 36px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:#fff;font-weight:800}.section-title{font-size:1.16rem;font-weight:800}.setup-lead{margin:-5px 0 14px;color:var(--muted);font-weight:600}
.level-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.choice{padding:11px 8px;border:2px solid var(--border);border-radius:10px;background:#fff;color:var(--ink);font-weight:700;cursor:pointer}.choice:hover,.choice.selected{border-color:var(--primary);background:var(--primary-light);color:var(--primary-dark)}.level-card{min-height:110px;text-align:left;padding:15px 14px;display:flex;flex-direction:column;justify-content:center;gap:5px}.level-name{font-size:1.02rem;font-weight:800}.level-note{font-size:.79rem;line-height:1.35;color:var(--muted)}
.topic-step{display:grid;grid-template-columns:40px 1fr;gap:12px;margin-top:24px;padding-top:22px;border-top:1px solid var(--border)}.substep-badge{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#dfeaf8;color:var(--primary-dark);font-weight:800}.topic-label{font-size:1.08rem;margin:0 0 4px;font-weight:800}.topic-guidance{margin:0 0 11px;color:var(--muted);font-size:.9rem}
input[type=text]{width:100%;min-height:48px;padding:11px 13px;border:2px solid var(--border);border-radius:var(--radius-sm)}input[type=text]:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 4px rgba(18,103,214,.13)}
.examples-wrap{margin-top:15px;padding-top:12px;border-top:1px dashed #d6deea}.helper{font-size:.78rem;color:#7b8796}.example-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}.quiet-examples .choice{padding:8px 7px;border:1px solid #e0e6ee;background:#f8fafc;color:#657181;font-size:.78rem}
.primary-btn,.secondary-btn{border:0;border-radius:11px;padding:13px 18px;font-weight:800;cursor:pointer}.primary-btn{width:100%;background:linear-gradient(135deg,var(--primary-dark),var(--primary));color:#fff}.secondary-btn{background:#fff;border:1px solid var(--border);color:var(--ink)}.status{display:none;text-align:center;margin:16px 0;color:var(--muted);font-weight:700}.status.loading-active{display:flex!important;align-items:center;justify-content:center;gap:10px}.status.loading-active::before{content:'';width:20px;height:20px;border:3px solid rgba(18,103,214,.18);border-top-color:var(--primary);border-radius:50%;animation:lingoSpin .8s linear infinite}@keyframes lingoSpin{to{transform:rotate(360deg)}}
.activity{display:none}.situation{font-weight:800;font-size:1.08rem;margin-bottom:14px}.intentions{display:grid;gap:9px}.intent{width:100%;text-align:left;padding:13px 14px;border:2px solid var(--border);border-radius:11px;background:#fff;cursor:pointer;font-weight:700}.intent:hover,.intent.selected{border-color:var(--primary);background:var(--primary-light)}
.responses{display:none;margin-top:16px}.response-card{padding:14px;border:1px solid var(--border);border-radius:12px;background:#fff;margin-bottom:10px}.response-text{font-weight:800;font-size:1.05rem}.response-note{margin-top:6px;color:var(--muted);font-size:.9rem}.response-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.response-actions button{border:1px solid var(--border);background:var(--soft);border-radius:8px;padding:8px 10px;cursor:pointer;font-weight:700}
.collection-bar{display:flex;justify-content:flex-end;margin:0 0 14px}.collection-btn{border:0;border-radius:10px;padding:10px 14px;background:#fff;color:var(--primary-dark);font-weight:800;cursor:pointer;box-shadow:var(--shadow)}.collection-panel{display:none}.collection-list{display:grid;gap:10px;margin-top:14px}.collection-item{padding:12px;border:1px solid var(--border);border-radius:11px;background:#fff}.collection-sentence{font-weight:800}.collection-meta{font-size:.78rem;color:var(--muted);margin-top:4px}
.notice{position:fixed;right:18px;top:98px;z-index:200;max-width:min(360px,calc(100% - 36px));padding:12px 15px;border-radius:10px;color:#fff;font-weight:700;box-shadow:var(--shadow);transform:translateX(130%);transition:.25s}.notice.show{transform:translateX(0)}.notice.info{background:#1267d6}.notice.success{background:#198754}.notice.error{background:#c83d4f}.footer{text-align:center;color:var(--muted);font-size:.72rem;padding:0 10px 24px}

/* Separate Home shortcut: keep the existing Activities / change languages control,
   with a compact home icon at the far right. */
.home-icon{
  width:42px;
  height:42px;
  flex:0 0 42px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  background:#fff;
  color:#084ca8;
  text-decoration:none;
  border:1px solid rgba(255,255,255,.45);
  box-sizing:border-box;
  transition:transform .15s ease, background .15s ease;
}
.home-icon svg{
  width:24px;
  height:24px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.home-icon:hover{transform:translateY(-1px);background:#f5f9ff}
.home-icon:focus-visible{outline:3px solid rgba(255,255,255,.7);outline-offset:2px}
@media(max-width:520px){
  .home-icon{width:42px;height:42px;flex-basis:42px}
}


/* ===== LINGOGO / TOURISM — job-ready treatment ===== */
:root{
  --design-black:#101010;
  --design-paper:#f4f0e8;
  --design-white:#fffdf8;
  --design-red:#6c4be3;
  --design-line:#bdb8ae;
  --design-grey:#6f6c66;
}

body{
  background:
    linear-gradient(rgba(16,16,16,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(16,16,16,.035) 1px, transparent 1px),
    var(--design-paper);
  background-size:28px 28px;
  color:var(--design-black);
}

.banner{
  background:var(--design-black);
  box-shadow:none;
  border-bottom:5px solid var(--design-red);
}

.brand-mark{
  border-radius:0;
  background:var(--design-red);
  color:#fff;
  box-shadow:none;
  font-weight:900;
}

.brand{letter-spacing:.12em;font-weight:900}
.tagline{font-family:inherit;letter-spacing:.05em;text-transform:uppercase;opacity:.72}
.language-pair{border-radius:0;border-color:#6c6c6c;background:transparent}
.home-link,.home-icon{
  border-radius:0 !important;
  background:#fff !important;
  color:#111 !important;
  border:0 !important;
  box-shadow:none !important;
}

.page{width:min(980px,calc(100% - 24px))}
.panel{
  border-radius:0;
  box-shadow:none;
  border:1.5px solid var(--design-black);
  background:var(--design-white);
}
.hero{
  position:relative;
  overflow:hidden;
  min-height:230px;
  display:grid;
  grid-template-columns:minmax(0,1.5fr) minmax(180px,.7fr);
  align-items:end;
  gap:28px;
  background:var(--design-white);
}
.hero:after{
  content:"LINGOGO";
  align-self:stretch;
  display:flex;
  align-items:flex-end;
  justify-content:flex-end;
  padding:0 0 4px;
  color:var(--design-red);
  font-size:clamp(2.2rem,6vw,5.8rem);
  font-weight:900;
  line-height:.84;
  letter-spacing:-.06em;
  text-align:right;
  max-width:7ch;
  word-break:break-word;
}
h1{
  font-size:clamp(2.4rem,7vw,5.7rem);
  line-height:.88;
  letter-spacing:-.055em;
  text-transform:uppercase;
  max-width:8ch;
  margin-bottom:18px;
}
.hero p{
  max-width:60ch;
  color:#45423d;
  font-size:1rem;
}
.design-kicker{
  margin:0 0 12px;
  color:var(--design-red);
  font-size:.78rem;
  font-weight:900;
  letter-spacing:.16em;
  text-transform:uppercase;
}
.design-disclaimer{
  margin-top:14px;
  font-size:.72rem;
  color:var(--design-grey);
}

.section-head{align-items:flex-start}
.number{
  border-radius:0;
  background:var(--design-black);
  color:#fff;
  font-weight:900;
}
.section-title{
  font-size:1.28rem;
  text-transform:uppercase;
  letter-spacing:.02em;
  font-weight:900;
}
.setup-lead{color:#55514b}
.level-grid{gap:0;border:1.5px solid var(--design-black)}
.level-card{
  border:0;
  border-right:1.5px solid var(--design-black);
  border-radius:0;
  background:#fff;
  min-height:132px;
}
.level-card:last-child{border-right:0}
.level-card:hover,.level-card.selected{
  background:var(--design-black);
  color:#fff;
  border-color:var(--design-black);
}
.level-card.selected .level-note,.level-card:hover .level-note{color:#d8d8d8}
.level-name{text-transform:uppercase;letter-spacing:.02em}
.topic-step{border-top:1.5px solid var(--design-black)}
.substep-badge{border-radius:0;background:var(--design-red);color:#fff}
.topic-label{text-transform:uppercase;letter-spacing:.02em}
input[type=text]{
  border-radius:0;
  border:1.5px solid var(--design-black);
  min-height:58px;
  background:#fff;
  font-size:1.02rem;
}
input[type=text]:focus{
  border-color:var(--design-red);
  box-shadow:0 0 0 3px rgba(226,75,53,.15);
}
.examples-wrap{border-top:1px solid var(--design-line)}
.quiet-examples .choice{
  border-radius:0;
  border:1px solid var(--design-line);
  background:#f7f4ed;
}
.choice:hover,.choice.selected,
.quiet-examples .choice:hover,.quiet-examples .choice.selected{
  background:var(--design-red);
  border-color:var(--design-red);
  color:#fff;
}
.primary-btn{
  border-radius:0;
  background:var(--design-red);
  text-transform:uppercase;
  letter-spacing:.06em;
}
.secondary-btn,.response-actions button,.collection-btn{
  border-radius:0;
  box-shadow:none;
}
.collection-btn{
  background:var(--design-black);
  color:#fff;
}
.activity{border-top:6px solid var(--design-red)}
.situation{
  font-size:clamp(1.45rem,4vw,2.3rem);
  line-height:1.05;
  letter-spacing:-.025em;
  max-width:28ch;
}
.intentions{
  grid-template-columns:repeat(2,1fr);
  gap:0;
  border:1.5px solid var(--design-black);
}
.intent{
  min-height:92px;
  border:0;
  border-right:1.5px solid var(--design-black);
  border-radius:0;
  background:#fff;
  text-transform:uppercase;
  letter-spacing:.025em;
  font-weight:900;
}
.intent:last-child{border-right:0}
.intent:hover,.intent.selected{
  background:var(--design-black);
  color:#fff;
}
.response-card{
  border-radius:0;
  border:1.5px solid var(--design-black);
  background:#fff;
  padding:18px;
}
.response-card:nth-child(odd){margin-left:0;margin-right:8%}
.response-card:nth-child(even){margin-left:8%;margin-right:0}
.response-text{
  font-size:clamp(1.18rem,3vw,1.7rem);
  line-height:1.18;
  letter-spacing:-.02em;
}
.response-note{
  border-top:1px solid var(--design-line);
  padding-top:9px;
}
.design-context-wrap{
  margin:22px 0 8px;
  padding-top:20px;
  border-top:1.5px solid var(--design-black);
}
.design-context-label{
  margin-bottom:9px;
  font-size:.78rem;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.12em;
}
.design-context-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:0;
  border:1.5px solid var(--design-black);
}
.design-context{
  min-height:92px;
  border:0;
  border-right:1.5px solid var(--design-black);
  border-bottom:1.5px solid var(--design-black);
  background:#fff;
  padding:12px;
  text-align:left;
  cursor:pointer;
}
.design-context:nth-child(3n){border-right:0}
.design-context:nth-last-child(-n+3){border-bottom:0}
.design-context:hover,.design-context.selected{
  background:var(--design-red);
  color:#fff;
}
.design-context strong{
  display:block;
  font-size:1rem;
  text-transform:uppercase;
  letter-spacing:.025em;
}
.design-context span{
  display:block;
  margin-top:5px;
  font-size:.76rem;
  line-height:1.28;
  opacity:.78;
}
.design-fields{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:14px;
}
.design-chip{
  padding:5px 8px;
  border:1px solid var(--design-black);
  font-size:.68rem;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.05em;
  background:#fff;
}
.footer{
  color:#4f4b46;
  text-transform:uppercase;
  letter-spacing:.08em;
}

@media(max-width:700px){
  .hero{grid-template-columns:1fr;min-height:0}
  .hero:after{display:none}
  .level-grid{grid-template-columns:1fr}
  .level-card{border-right:0;border-bottom:1.5px solid var(--design-black)}
  .level-card:last-child{border-bottom:0}
  .design-context-grid{grid-template-columns:1fr}
  .design-context{border-right:0 !important;border-bottom:1.5px solid var(--design-black) !important}
  .design-context:last-child{border-bottom:0 !important}
  .intentions{grid-template-columns:1fr}
  .intent{border-right:0;border-bottom:1.5px solid var(--design-black)}
  .intent:last-child{border-bottom:0}
  .response-card:nth-child(n){margin-left:0;margin-right:0}
}

const uiNames={en:'English',ca:'Català',es:'Español',fr:'Français',de:'Deutsch',it:'Italiano',pt:'Português',eu:'Euskara',ja:'日本語',ar:'العربية'};
const targetNames={English:'English',Catalan:'Català',Spanish:'Español',French:'Français',German:'Deutsch',Italian:'Italiano',Portuguese:'Português',Basque:'Euskara',Japanese:'日本語',Arabic:'العربية'};
const voiceLocales={English:'en-GB',Catalan:'ca-ES',Spanish:'es-ES',French:'fr-FR',German:'de-DE',Italian:'it-IT',Portuguese:'pt-PT',Basque:'eu-ES',Japanese:'ja-JP',Arabic:'ar-SA'};
const params=new URLSearchParams(location.search);
let uiLanguage=params.get('ui')||localStorage.getItem('lingototal_ui_language')||'en';
let targetLanguage=params.get('target')||localStorage.getItem('lingototal_target_language')||'English';
if(!uiNames[uiLanguage])uiLanguage='en';if(!targetNames[targetLanguage])targetLanguage='English';
localStorage.setItem('lingototal_ui_language',uiLanguage);localStorage.setItem('lingototal_target_language',targetLanguage);
const $=id=>document.getElementById(id),tr=k=>(T[uiLanguage]||T.en)[k]||T.en[k]||k;
let selectedLevel='',selectedDesignContext='',situations=[],current=0;
function applyLanguage(){document.documentElement.lang=uiLanguage;document.documentElement.dir=uiLanguage==='ar'?'rtl':'ltr';document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=tr(e.dataset.i18n));document.querySelectorAll('[data-i18n-placeholder]').forEach(e=>e.placeholder=tr(e.dataset.i18nPlaceholder));document.querySelectorAll('[data-i18n-aria-label]').forEach(e=>e.setAttribute('aria-label',tr(e.dataset.i18nAriaLabel)));document.querySelectorAll('[data-i18n-title]').forEach(e=>e.setAttribute('title',tr(e.dataset.i18nTitle)));document.querySelectorAll('.example').forEach(b=>b.dataset.theme=tr(b.dataset.themeKey));$('languagePair').textContent=uiNames[uiLanguage]+' → '+targetNames[targetLanguage];document.title='LingoTotal · '+tr('title')}
function notice(m,t='info'){const n=$('notice');n.textContent=m;n.className='notice show '+t;clearTimeout(notice.timer);notice.timer=setTimeout(()=>n.classList.remove('show'),3000)}
function speak(text){LingoTTS.speak(text,voiceLocales[targetLanguage]||'en-GB',.9).catch(()=>{})}
document.querySelectorAll('.level').forEach(b=>b.onclick=()=>{document.querySelectorAll('.level').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selectedLevel=(b.dataset.level==='beginner'||b.dataset.level==='intermediate')?b.dataset.level:''});

document.querySelectorAll('.design-context').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.design-context').forEach(x=>x.classList.remove('selected'));
  b.classList.add('selected');
  selectedDesignContext=b.dataset.context;
});

document.querySelectorAll('.example').forEach(b=>b.onclick=()=>{$('themeInput').value=b.dataset.theme});

// Keep the learner's own request as the authoritative Section 2 value.
const themeInputEl=$('themeInput');
let learnerTypedNeed=themeInputEl ? themeInputEl.value.trim() : '';
if(themeInputEl){
  themeInputEl.addEventListener('input',()=>{ learnerTypedNeed=themeInputEl.value.trim(); });
  themeInputEl.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      e.preventDefault();
      learnerTypedNeed=themeInputEl.value.trim();
      $('generateBtn').click();
    }
  });

document.querySelectorAll('.example').forEach(b=>b.addEventListener('click',()=>{learnerTypedNeed=$('themeInput').value.trim();}));
async function callGeminiAPI(prompt){const r=await fetch('/.netlify/functions/gemini',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,model:'gemini-2.5-flash',temperature:.7})});let d;try{d=await r.json()}catch{throw new Error('Invalid server response')}if(!r.ok)throw new Error(d?.error||'Server error');const result=d?.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('')||'';if(!result)throw new Error('Empty AI response');return result}
function parseJSON(text){const clean=String(text||'').replace(/```json/gi,'').replace(/```/g,'').trim();const start=clean.indexOf('{'),end=clean.lastIndexOf('}');if(start<0||end<0)throw new Error('AI format error');let d;try{d=JSON.parse(clean.slice(start,end+1))}catch{throw new Error('AI format error')}const raw=Array.isArray(d?.situations)?d.situations:[];const usable=raw.slice(0,4).map(s=>{const situation=String(s?.situation||'').trim();const intentions=(Array.isArray(s?.intentions)?s.intentions:[]).slice(0,3).map(i=>{const label=String(i?.label||'').trim();const responses=(Array.isArray(i?.responses)?i.responses:[]).slice(0,2).map(r=>({text:String(r?.text||'').trim(),note:String(r?.note||'').trim()})).filter(r=>r.text);return {label,responses}}).filter(i=>i.label&&i.responses.length);return {situation,intentions}}).filter(s=>s.situation&&s.intentions.length);if(!usable.length)throw new Error('AI format error');return usable}
function renderSituation(){const s=situations[current];$('activity').style.display='block';$('waiting').style.display='none';$('progress').textContent=(current+1)+' / '+situations.length;$('situation').textContent=s.situation;$('intentions').innerHTML='';$('responses').style.display='none';$('responses').innerHTML='';$('nextWrap').style.display='none';s.intentions.forEach(intent=>{const b=document.createElement('button');b.className='intent';b.textContent=intent.label;b.onclick=()=>showResponses(intent,b);$('intentions').appendChild(b)})}
function showResponses(intent,b){document.querySelectorAll('.intent').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');const box=$('responses');box.innerHTML='';box.style.display='block';intent.responses.forEach(r=>{const card=document.createElement('div');card.className='response-card';card.innerHTML='<div class="response-text">'+r.text+'</div><div class="response-note">'+r.note+'</div>';const actions=document.createElement('div');actions.className='response-actions';const listen=document.createElement('button');listen.textContent=tr('listen');listen.onclick=()=>speak(r.text);const save=document.createElement('button');save.textContent=tr('save');save.onclick=()=>saveSentence(r.text);actions.append(listen,save);card.append(actions);box.append(card)});$('nextWrap').style.display='block'}
$('nextBtn').onclick=()=>{current=(current+1)%situations.length;renderSituation()};
const COLLECTION_KEY='lingototal_saved_sentences_v2';
function getCollection(){try{return JSON.parse(localStorage.getItem(COLLECTION_KEY)||'[]')}catch{return []}}
function setCollection(d){localStorage.setItem(COLLECTION_KEY,JSON.stringify(d));$('collectionCount').textContent=d.length}
function saveSentence(sentence){const d=getCollection();if(d.some(x=>x.sentence===sentence&&x.targetLanguage===targetLanguage))return notice(tr('alreadySaved'),'info');d.unshift({sentence,targetLanguage,targetName:targetNames[targetLanguage],theme:$('themeInput').value.trim()});setCollection(d);notice(tr('savedMessage'),'success')}
function renderCollection(){const list=$('collectionList'),d=getCollection();list.innerHTML='';if(!d.length){list.textContent=tr('emptyCollection');return}d.forEach((x,i)=>{const row=document.createElement('div');row.className='collection-item';row.innerHTML='<div class="collection-sentence">'+x.sentence+'</div><div class="collection-meta">'+(x.targetName||'')+(x.theme?' · '+tr('themeLabel')+': '+x.theme:'')+'</div>';const a=document.createElement('div');a.className='response-actions';const l=document.createElement('button');l.textContent=tr('listen');l.onclick=()=>speak(x.sentence);const r=document.createElement('button');r.textContent=tr('remove');r.onclick=()=>{d.splice(i,1);setCollection(d);renderCollection()};a.append(l,r);row.append(a);list.append(row)})}
$('openCollectionBtn').onclick=()=>{renderCollection();$('collectionPanel').style.display='block'};$('closeCollectionBtn').onclick=()=>{$('collectionPanel').style.display='none'};
$('downloadCollectionBtn').onclick=()=>{const d=getCollection();if(!d.length)return notice(tr('noSaved'),'info');const blob=new Blob(['\uFEFF'+d.map((x,i)=>(i+1)+'. '+x.sentence).join('\n')],{type:'text/plain;charset=utf-8'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='My-LingoTotal-Collection.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),500)};
$('generateBtn').onclick=async()=>{const theme=$('themeInput').value.trim();learnerTypedNeed=theme;if(!selectedLevel)return notice(tr('selectLevel'),'error');if(!theme)return notice(tr('enterTopic'),'error');const level={beginner:'A1-A2 simple high-frequency spoken language',intermediate:'B1-B2 natural everyday and workplace language with flexibility and common conversational chunks'}[selectedLevel];const moveContext=selectedDesignContext||'general international relocation and settling-in communication';
const prompt=`Create a LingoGo Moving Country activity for a person learning ${targetLanguage} who is preparing to move, is moving, or has recently moved to another country.
Learner's need: "${theme}"
IMPORTANT: The learner's exact need above is the PRIMARY task. Every generated situation must directly help with that need. Do not replace it with a generic activity from the selected category. The selected category is supporting context only. If the learner has typed a specific question, problem, sentence or scenario, stay closely focused on it.
Relocation context: ${moveContext}
Level: ${level}.

The pedagogical focus is COMMUNICATIVE INTENTION DURING INTERNATIONAL RELOCATION. Generate language the learner can actually use to get things done and to build a life in the new country.

Use realistic contexts where relevant: immigration or residence administration, identity documents, official appointments, forms and deadlines; housing searches, viewings, rental agreements, deposits, landlords and repairs; removals, shipping and storage; banking and payments; utilities, phone and internet; healthcare registration and reception; employment and workplace administration; schools and childcare; transport and driving administration; local registration and public services; meeting neighbours and making friends; cultural misunderstandings, loneliness, homesickness, asking for support, maintaining relationships back home, and gaining confidence in the local community.

IMPORTANT SAFETY BOUNDARY: this is LANGUAGE PRACTICE, not legal, immigration, tax, financial or medical advice. Never tell the learner what the law is, what visa they qualify for, what tax they owe, what medical treatment they need, or what a contract legally means. When the situation touches these areas, generate useful language for asking an official authority or qualified professional, checking requirements, requesting clarification, confirming documents, deadlines and next steps. Rules vary by country and personal circumstances.


MANDATORY THREE-SITUATION FOCUS RULE:
Treat the learner's submission as ONE communication goal. Create THREE different but CLOSELY RELATED situations that explore useful aspects of THAT SAME GOAL.
Situation 1, Situation 2 and Situation 3 must each be recognisably about the learner's submitted need.
Do NOT use later situations to change topic or return to generic themes from this page.
Do NOT introduce qualifications, teamwork, language ability, availability, customers, travel, accommodation, study, interviews, or any other built-in topic unless it is part of the learner's submission or directly necessary to practise that exact communication goal.
Before returning the JSON, internally check all three situations and every intention against the learner's submission. If any situation or intention is not directly relevant, replace it with one that is.
Variation must come from different angles, interlocutors, stages, or communicative purposes WITHIN the same learner goal — never from changing the goal.

Create exactly 3 realistic moving-country situations.
For EACH situation:
- Write the situation in the interface language ${uiNames[uiLanguage]}.
- Give exactly 3 clearly different communicative intentions in ${uiNames[uiLanguage]}.
- For EACH intention give exactly 2 short, natural ${targetLanguage} responses.
- For each response give one brief note in ${uiNames[uiLanguage]} explaining tone, usefulness or nuance.
- Keep target-language responses concise and genuinely useful for speaking.
- Prefer authentic contemporary spoken language over textbook language.
- Include clarification and checking language where misunderstanding could have consequences.
- Match register to the person being addressed: official, landlord, service provider, colleague, neighbour, friend or professional adviser.
- Emotional situations should be practical and humane: expressing uncertainty, asking for help, saying you miss home, explaining that you are still adjusting, joining local activities, or resolving cultural misunderstandings.
- Do not invent personal facts about the learner.
- Do not translate the target-language responses into the interface language.
- Do not claim one response is the only possible answer.

Return ONLY valid JSON, with no markdown or commentary, in exactly this structure:
{"situations":[{"situation":"...","intentions":[{"label":"...","responses":[{"text":"...","note":"..."},{"text":"...","note":"..."}]}]}]}`;try{$('loading').classList.add('loading-active');$('waiting').style.display='none';$('generateBtn').disabled=true;situations=parseJSON(await callGeminiAPI(prompt));current=0;renderSituation()}catch(e){$('waiting').style.display='block';notice(tr('serverError')+' '+e.message,'error')}finally{$('loading').classList.remove('loading-active');$('generateBtn').disabled=false}};
applyLanguage();$('collectionCount').textContent=getCollection().length;
});
</script>
<script>
(function(){const cache=new Map();let audio=null;async function speak(text,language='en-GB',speakingRate=.95){if(audio){try{audio.pause()}catch{}}const key=language+'|'+speakingRate+'|'+text;let src=cache.get(key);if(!src){const r=await fetch('/.netlify/functions/google-tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,language,speakingRate})});if(!r.ok)throw new Error('Audio error');const b=await r.blob();src=URL.createObjectURL(b);cache.set(key,src)}audio=new Audio(src);await audio.play()}window.LingoTTS={speak}})();
</script>
